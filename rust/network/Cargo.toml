[package]
name = "coder-network"
version = "1.5.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Authenticated outbound workspace relay, agent, and port forwarding"
publish = false

[dependencies]
boringtun = { version = "0.7.1", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
portable-pty = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[target."cfg(unix)".dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }

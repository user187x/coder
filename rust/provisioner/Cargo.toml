[package]
name = "coder-provisioner"
version = "1.5.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Rust Terraform infrastructure provisioner for the Coder control plane"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"

[package]
name = "coder-core"
version = "1.5.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Shared Coder protocol and validation logic"
publish = false

[workspace]
members = ["ui", "server", "provisioner"]
default-members = [".", "ui", "server", "provisioner"]
resolver = "3"

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

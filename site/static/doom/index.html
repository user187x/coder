<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOOM</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* SDL reads mouse coordinates from the canvas: it must have no border or padding. */
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; border: 0; padding: 0; outline: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #000; color: #e11d1d; font: 700 28px/1.2 monospace; cursor: pointer; letter-spacing: 0.08em; }
  #start small { color: #a1a1aa; font: 400 13px/1.6 monospace; letter-spacing: 0; text-align: center; }
  #start[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="start" role="button" tabindex="0">
  <span id="status">CLICK TO PLAY</span>
  <small>Move W A S D · Turn: mouse or arrows · Fire: Space or click · Use: E · Run: Shift · Menu: Esc<br>
  Click the game to capture the mouse; Esc releases it.</small>
</div>
<script src="launcher.js"></script>
</body>
</html>

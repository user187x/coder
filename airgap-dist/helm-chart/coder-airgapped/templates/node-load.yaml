{{- include "ca.values" . -}}
{{- if and .Values.uiUpdates.enabled .Values.uiUpdates.nodeLoad.enabled (include "platform.hasLayer" .) }}
{{- $ns := .Values.platformWebhook.runtimeIsolation.serviceNamespace }}
{{- if eq $ns .Release.Namespace }}
{{- fail "node load collector serviceNamespace must differ from the protected release namespace" }}
{{- end }}
{{- if not (and .Values.platformWebhook.enabled (or .Values.platformWebhook.runtimeIsolation.enabled .Values.platformWebhook.runtimeIsolation.prepareBackend)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-node-load
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-node-load
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-node-load
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-node-load
subjects:
  - {kind: ServiceAccount, name: coder-node-load, namespace: {{ $ns }}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coder-node-load
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels: {app: coder-node-load}
  template:
    metadata:
      labels: {app: coder-node-load}
    spec:
      serviceAccountName: coder-node-load
      {{- with .Values.uiUpdates.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {kubernetes.io/os: linux}
      tolerations:
        - {operator: Exists}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: {{ .Values.uiUpdates.image }}
          command: [python3, /app/nodeload.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: loadavg, mountPath: /host-loadavg, readOnly: true}
      volumes:
        - name: loadavg
          hostPath: {path: /proc/loadavg, type: File}
{{- end }}

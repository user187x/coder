{{- include "ca.values" . -}}
{{- $s := .Values.secrets }}
{{- /* secrets.generateTls: with no CA and wildcard certificate given, the chart makes them (a CA of its own and a
     certificate for the domain, Coder's host and the wildcard host) - once: an upgrade finds and keeps them. For a
     test install; browsers must be told to trust the CA (the Secret's ca.crt). */ -}}
{{- $gen := dict }}
{{- if and $s.generateTls (include "platform.hasBase" .) }}
{{- $caOld := (lookup "v1" "Secret" .Release.Namespace $s.tlsCa.name).data | default dict }}
{{- $tlsOld := (lookup "v1" "Secret" .Release.Namespace $s.wildcardTls.name).data | default dict }}
{{- if and (index $caOld "ca.crt") (index $tlsOld "tls.crt") (index $tlsOld "tls.key") }}
{{- $gen = dict "caCrt" (index $caOld "ca.crt" | b64dec) "tlsCrt" (index $tlsOld "tls.crt" | b64dec) "tlsKey" (index $tlsOld "tls.key" | b64dec) }}
{{- else }}
{{- $domain := .Values.global.domain }}
{{- $coder := include "platform.coderHost" . | trim }}
{{- $wild := include "platform.wildcardHost" . | trim }}
{{- $ca := genCA (printf "coder-airgapped %s CA" $domain) 3650 }}
{{- $crt := genSignedCert $coder nil (uniq (list $coder $wild (printf "*.%s" $domain) $domain)) 3650 $ca }}
{{- $gen = dict "caCrt" $ca.Cert "tlsCrt" $crt.Cert "tlsKey" $crt.Key }}
{{- end }}
{{- end }}
{{- if and $s.initAuth.create (include "platform.hasBase" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.initAuth.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  email: {{ $s.initAuth.email | quote }}
  username: {{ $s.initAuth.username | quote }}
  password: {{ include "ca.secretValue" (list $s.initAuth.password . $s.initAuth.name "password") | quote }}
{{- end }}
{{- if and $s.logsDb.create (include "platform.hasLayer" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.logsDb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  password: {{ include "ca.secretValue" (list $s.logsDb.password . $s.logsDb.name "password") | quote }}
{{- end }}
{{- range $key, $cfg := dict "tlsCa" $s.tlsCa "oidcCa" $s.oidcCa }}
{{- $caCrt := $cfg.caCrt }}
{{- if and (eq $key "tlsCa") (not $caCrt) $gen.caCrt }}{{ $caCrt = $gen.caCrt }}{{ end }}
{{- if and (or $cfg.create (and (eq $key "tlsCa") $gen.caCrt)) (include "platform.hasBase" $) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ca.labels" $ | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ required (printf "secrets.%s.caCrt is required when secrets.%s.create is true" $key $key) $caCrt | quote }}
{{- end }}
{{- end }}
{{- if and $s.oidcClient.create (include "platform.hasBase" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.oidcClient.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "secrets.oidcClient.clientSecret is required" $s.oidcClient.clientSecret | quote }}
{{- end }}
{{- if and (or $s.wildcardTls.create $gen.tlsCrt) (include "platform.hasBase" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.wildcardTls.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "secrets.wildcardTls.tlsCrt is required" ($s.wildcardTls.tlsCrt | default $gen.tlsCrt) | quote }}
  tls.key: {{ required "secrets.wildcardTls.tlsKey is required" ($s.wildcardTls.tlsKey | default $gen.tlsKey) | quote }}
{{- end }}

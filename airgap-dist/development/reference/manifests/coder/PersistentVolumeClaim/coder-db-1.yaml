apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    cnpg.io/nodeSerial: '1'
    cnpg.io/operatorVersion: 1.30.0
    cnpg.io/pvcStatus: ready
    pv.kubernetes.io/bind-completed: 'yes'
    pv.kubernetes.io/bound-by-controller: 'yes'
    volume.beta.kubernetes.io/storage-provisioner: hostpath.csi.k8s.io
    volume.kubernetes.io/selected-node: minikube
    volume.kubernetes.io/storage-provisioner: hostpath.csi.k8s.io
  finalizers:
  - kubernetes.io/pvc-protection
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: cloudnative-pg
    app.kubernetes.io/name: postgresql
    cnpg.io/cluster: coder-db
    cnpg.io/instanceName: coder-db-1
    cnpg.io/instanceRole: replica
    cnpg.io/pvcRole: PG_DATA
    role: replica
  name: coder-db-1
  namespace: coder
  ownerReferences:
  - apiVersion: postgresql.cnpg.io/v1
    controller: true
    kind: Cluster
    name: coder-db
    uid: 54243ed9-df37-4b24-acb8-88a154956198
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard-k8s
  volumeMode: Filesystem

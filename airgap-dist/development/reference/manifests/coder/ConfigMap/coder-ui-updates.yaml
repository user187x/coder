  classification.js: "// The classification marking on every Coder page (sign-in page included): two identical bars, one glued to the very\n// top of the window and one to the very bottom, above everything\
    \ else. The page is inset by the bars' height so\n// nothing of Coder's hides underneath them (its sticky navbar sits below the top bar, full-height screens shrink).\n// Settings come from the coder-ui-updates\
    \ service (/__coder-ui/api/classification), re-read every 30 seconds and\n// at once when an admin saves them in Deployment > Classification.\n\nconst API = '/__coder-ui/api/classification';\nconst\
    \ REFRESH_MS = 30000;\nconst Z = 2147483000; // above Coder's dialogs and toasts\nlet current = null;\nlet bars = null;\nlet style = null;\n\nfunction create() {\n  const make = (edge) => {\n    const\
    \ bar = document.createElement('div');\n    bar.id = `coder-classification-${edge}`;\n    bar.setAttribute('role', 'note');\n    bar.setAttribute('aria-label', 'Classification');\n    // 100vw, not\
    \ right:0: Coder reserves a scrollbar gutter (scrollbar-gutter: stable) that right:0 would leave uncovered.\n    bar.style.cssText = `position:fixed;left:0;width:100vw;${edge}:0;z-index:${Z};display:flex;align-items:center;justify-content:center;`\n\
    \      + 'box-sizing:border-box;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700;'\n      + 'letter-spacing:.06em;font-family:inherit;pointer-events:none;user-select:none';\n\
    \    return bar;\n  };\n  bars = [make('top'), make('bottom')];\n  style = document.createElement('style');\n  style.id = 'coder-classification-style';\n}\n\nfunction apply(c) {\n  current = c;\n  const\
    \ on = c && c.enabled && c.text;\n  if (!on) {\n    bars?.forEach((b) => b.remove());\n    style?.remove();\n    return;\n  }\n  if (!bars) create();\n  const h = Math.max(12, Math.min(64, Number(c.height)\
    \ || 24));\n  const font = Math.max(10, Math.min(20, Math.round(h * 0.55)));\n  for (const bar of bars) {\n    bar.textContent = c.text;\n    bar.style.height = `${h}px`;\n    bar.style.lineHeight =\
    \ `${h}px`;\n    bar.style.fontSize = `${font}px`;\n    bar.style.background = c.background;\n    bar.style.color = c.color;\n    if (!bar.isConnected) document.body.appendChild(bar);\n  }\n  // Coder\
    \ reserves a scrollbar gutter on <html> (scrollbar-gutter: stable). A fixed bar cannot paint into it (current\n  // browsers also leave it out of 100vw), so without a scrollbar the bars stopped short\
    \ of the right edge. The page\n  // background shows there: paint it, fixed to the window, in the bars' colour at the top and bottom edges.\n  const bg = String(c.background).replace(/[;{}<>]/g, '');\n\
    \  style.textContent = `\n    html { --coder-classification-h: ${h}px;\n      background: linear-gradient(to bottom, ${bg} 0 ${h}px, hsl(var(--surface-primary)) ${h}px calc(100% - ${h}px), ${bg} calc(100%\
    \ - ${h}px)) fixed !important; }\n    body { padding-top: ${h}px !important; padding-bottom: ${h}px !important; box-sizing: border-box; }\n    div.sticky.top-0 { top: ${h}px !important; }\n    .sticky.bottom-0,\
    \ .fixed.bottom-0 { bottom: ${h}px !important; } /* e.g. the deployment stats bar: above our bar, not under it */\n    [data-sonner-toaster][data-y-position=bottom] { bottom: calc(${h}px + 24px) !important;\
    \ } /* Coder's toasts too */\n    .h-screen { height: calc(100vh - ${2 * h}px) !important; }\n    .min-h-screen { min-height: calc(100vh - ${2 * h}px) !important; }\n    .max-h-screen { max-height:\
    \ calc(100vh - ${2 * h}px) !important; }`;\n  if (!style.isConnected) document.head.appendChild(style);\n}\n\nasync function load() {\n  try {\n    const res = await fetch(API, { credentials: 'same-origin',\

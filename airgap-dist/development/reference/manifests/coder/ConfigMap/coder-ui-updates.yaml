    \ background: var(--ok); } .status.warn::before { background: var(--warn); } .status.error::before { background: var(--danger); }\n"
  network.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Cluster Network \xB7 Coder</title>\n\

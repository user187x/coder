    \ row;\n}\n\nfunction worst(checks) {\n  if (checks.some((c) => c.status === 'error')) return 'error';\n  if (checks.some((c) => c.status === 'warn')) return 'warn';\n  return 'ok';\n}\n\n// \"kc.connect\"\
    \ is not applied like the others: it needs an admin to sign in once (the Connect card).\nfunction fixesNeeded() {\n  return [...new Set(report.checks.filter((c) => c.fix && c.fix !== 'kc.connect').map((c)\
    \ => c.fix))];\n}\n\nfunction render() {\n  const { checks, facts } = report;\n  const level = worst(checks);\n  const fixes = fixesNeeded();\n  const problems = checks.filter((c) => c.status === 'error'\
    \ || c.status === 'warn').length;\n  $('status-dot').className = `big-dot ${level}`;\n  $('status-h').textContent = level === 'ok' ? 'Keycloak sign-in for Coder is set up correctly'\n    : `${problems}\

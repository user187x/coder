  theme-toggle.js: "// The \"Dark Mode\" switch in the user menu (it replaces the \"Documentation\" link). The rewritten entry chunk renders the\n// item and calls bind() for its switch and toggle() when\
    \ it is chosen. It flips the user's own Coder appearance\n// setting between \"Dark default\" and \"Light default\" (single-theme mode), keeping their terminal font and the themes\n// they picked for\
    \ \"Sync with system\", then has Coder re-read the setting (window.__cuiAppearance is the dashboard's\n// appearance query, exposed by the rewrite), so the theme changes at once, here and in embedded\
    \ Coder frames.\nconst API = '/api/v2/users/me/appearance';\nconst bound = new Set();\nlet busy = false;\n\nconst isDark = () => ![...document.documentElement.classList].some((c) => c === 'light' ||\
    \ c.startsWith('light-'));\n\nfunction csrf() {\n  return document.querySelector('meta[property=\"csrf-token\"]')?.getAttribute('content') || '';\n}\n\nfunction paint(on) {\n  for (const sw of bound)\
    \ {\n    if (!sw.isConnected) { bound.delete(sw); continue; }\n    sw.dataset.on = on ? '1' : '0';\n    sw.closest('[role]')?.setAttribute('aria-checked', String(on));\n  }\n}\n\nconst watch = new MutationObserver(()\
    \ => paint(isDark()));\nwatch.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });\n\nexport function bind(sw) {\n  bound.add(sw);\n  paint(isDark());\n}\n\nexport async\
    \ function toggle() {\n  if (busy) return;\n  busy = true;\n  const dark = !isDark();\n  paint(dark);\n  try {\n    const res = await fetch(API, { credentials: 'same-origin', headers: { Accept: 'application/json'\
    \ } });\n    const current = res.ok ? await res.json() : {};\n    // terminal_font is required; \"\" (never chosen) means Coder's default, which its own page sends as geist-mono.\n    const body = {\
    \ ...current, theme_preference: dark ? 'dark' : 'light', terminal_font: current.terminal_font || 'geist-mono' };\n    // Coder v2.37+: single theme instead of following the system; the light / dark\
    \ picks for \"Sync with system\" must\n    // be real themes (a user who never saved any gets \"\" back, which the API refuses), as Coder's own page sends them.\n    if ('theme_mode' in current) {\n\
    \      body.theme_mode = 'single';\n      body.theme_light = current.theme_light || 'light';\n      body.theme_dark = current.theme_dark || 'dark';\n    }\n    const put = await fetch(API, {\n     \
    \ method: 'PUT',\n      credentials: 'same-origin',\n      headers: { 'Content-Type': 'application/json', Accept: 'application/json', 'X-CSRF-TOKEN': csrf() },\n      body: JSON.stringify(body),\n \
    \   });\n    if (!put.ok) throw new Error(`HTTP ${put.status}`);\n    const query = window.__cuiAppearance;\n    if (query && typeof query.refetch === 'function') await query.refetch();\n    else window.location.reload();\n\
    \    for (const frame of document.querySelectorAll('iframe[data-cui-embed]')) {\n      try { frame.contentWindow.__cuiAppearance?.refetch?.(); } catch { /* not loaded yet */ }\n    }\n  } catch (e)\
    \ {\n    console.warn('coder-ui-updates: the theme could not be changed', e);\n    paint(isDark());\n  } finally {\n    busy = false;\n  }\n}\n"
  ui-service.py: "\"\"\"coder-ui-updates service, served on Coder's hostname under /__coder-ui/ (Python standard library only).\n\n  GET  /__coder-ui/<file>                 the dashboard add-ons (dashboard.js,\
    \ views, ..., the Workspaces icon), revalidated on every use\n  GET  /__coder-ui/refresh                clears the browser's cached Coder JavaScript (Clear-Site-Data) and returns to /\n  GET  /__coder-ui/healthz\n\
    \n  Announcement receipts\n  GET  /__coder-ui/api/me?id=X            signed in? and did they confirm announcement X\n  POST /__coder-ui/api/view   {\"id\": X}   the signed-in user has seen announcement\
    \ X\n  POST /__coder-ui/api/ack    {\"id\": X}   ... and confirmed it\n  GET  /__coder-ui/api/acks               admins: every announcement (\"event\") with who saw / confirmed it, who has not\n  POST\
    \ /__coder-ui/api/events/delete {\"id\": X}   admins: forget one announcement and its receipts\n\n  Network map (admins; nodes, pods and metrics read cluster-wide through the ClusterRole coder-ui-updates-<namespace>)\n\
    \  GET  /__coder-ui/api/network            nodes (addresses, capacity, usage), Coder's pods, running workspaces per node\n  GET  /__coder-ui/api/cluster/usage      CPU / memory totals (allocatable,\
    \ in use, requested, free): the Admin menu's bars\n\n  Classification banner\n  GET  /__coder-ui/api/classification     public (the marking shows on the sign-in page too)\n  POST /__coder-ui/api/classification\
    \     admins: {enabled, text, height, background, color}\n\n  Logo (stored in Coder's own CloudNativePG database, schema coder_ui_updates)\n  GET  /__coder-ui/boot.js                loaded first by\
    \ every Coder page: the logo (and classification) to use\n  GET  /__coder-ui/logo?v=<sha>           the uploaded logo          GET /__coder-ui/favicon/<name>  logo or Coder's\n  GET  /__coder-ui/api/logo\
    \               what is set                POST /__coder-ui/api/logo {\"dataUrl\"}, /api/logo/reset\n\n  User avatars (every user, their own; rows in coder_ui_updates.avatar of Coder's database)\n \
    \ GET  /__coder-ui/avatar/<user id>?v=<sha>   the picture            GET  /__coder-ui/api/avatar   mine\n  POST /__coder-ui/api/avatar {\"dataUrl\"}     set mine               POST /__coder-ui/api/avatar/reset\
    \   remove mine\n  GET  /__coder-ui/avatar/default?v=<sha>     the default avatar     GET  /__coder-ui/api/avatar/defaults   who gets it\n\n  Chat (every signed-in user; admins in ADMIN_ROLES write\
    \ to anyone, others to admins or whoever wrote to them;\n        kept 30 days in SQLite)\n  GET  /__coder-ui/api/chat/state          me, my conversations (last message, unread), newest message id\n\
    \  GET  /__coder-ui/api/chat/messages?peer=<user id>[&before=<id>]   one conversation (100 at a time)\n  GET  /__coder-ui/api/chat/poll?after=<id>&typing=<ids>   long poll (25 s): new messages, who\
    \ is typing to me\n  POST /__coder-ui/api/chat/send {\"to\", \"text\"}   POST /api/chat/typing {\"to\"}   POST /api/chat/read {\"to\", \"last\"}\n  GET  /__coder-ui/api/chat/admins          the admins\
    \ a user may write to (their line to support): those with chat on\n  POST /__coder-ui/api/chat/availability {\"enabled\"}   admins: their chat on / off (off: developers can't write to them)\n  GET \
    \ /__coder-ui/api/chat/file/<id>       a message's screenshot (the two people in the conversation only)\n  POST /__coder-ui/api/chat/send also takes {\"image\": data URL, \"page\": path}: a screenshot\
    \ (PNG / JPEG / WebP, 4 MB)\n  User quota (Health > User Quota; admins, and Coder's own check before it creates a workspace)\n  GET  /__coder-ui/api/quota               limits, every user's usage (built\
    \ with / running / live) and the cluster\n  POST /__coder-ui/api/quota               {\"default\": {workspaces, cpu, memory}, \"users\": {name: {...}}, \"exemptAdmins\"}\n  POST /__coder-ui/api/quota/check\
    \         {owner, template_id | template_version_id, rich_parameter_values}: allowed?\n  GET  /__coder-ui/api/keycloak/status     admins: is Keycloak's admin API usable (General sidebar's check)\n \
    \ GET  /__coder-ui/api/certificates[?refresh]  admins: TLS of Coder / Keycloak / database and every mounted certificate\n  POST /__coder-ui/api/chat/delete {\"to\"}   the whole conversation, for both\
    \ (either participant); the other side's\n       poll answers with \"cleared\": [user id]\n\n  Default images (resources/defaults/, mounted from ConfigMaps coder-ui-updates-default-logo / -avatar into\n\
    \  DEFAULTS_DIR): the logo a fresh installation starts with (written to the logo table when this service creates it),\n  and the avatar of every user without a picture of their own (neither uploaded\
    \ here nor from Coder / OIDC).\n\n  Monitoring (admins; workspace pod logs streamed into the temporary Postgres coder-ui-logs-db, 5 MB per instance)\n  GET  /__coder-ui/api/monitoring          users\
    \ and their running workspaces\n  GET  /__coder-ui/api/monitoring/logs?workspace=<id>&after=<seq>   new log lines (starts / keeps the follower)\n\n  Keycloak <-> Coder sign-in (admins)\n  GET  /__coder-ui/api/keycloak\
    \           discovery: every check with its current / expected value and a suggested fix\n  POST /__coder-ui/api/keycloak/apply     {\"fixes\": [...], \"settings\": {...}}  apply approved fixes\n  POST\
    \ /__coder-ui/api/keycloak/undo      put Coder's previous Argo CD values back\n\nAn announcement \"event\" is one announcement as coder-banner identifies it: its id changes when the text changes or\
    \ an\nadmin uses \"Show again to everyone\". Only the live announcement (or one already recorded) is accepted.\n\nUsers are identified by their Coder session (the coder_session_token cookie the browser\
    \ already sends), checked against\nCoder's own API. Admin endpoints require one of ADMIN_ROLES; state-changing requests also need the X-Requested-With\nheader and a same-origin Origin (cross-site protection).\
    \ Keycloak's admin credentials and the OIDC client secret are\nread in-cluster (Kubernetes API, RBAC limited to the named Secrets) and never sent to the browser.\n\"\"\"\n\nimport base64\nimport hashlib\n\
    import json\nimport mimetypes\nimport os\nimport re\nimport sqlite3\nimport ssl\nimport sys\nimport threading\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom datetime\
    \ import datetime, timezone\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nimport pgwire  # noqa: E402  (next to this file)\nfrom http.cookies import SimpleCookie\nfrom http.server\
    \ import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nPORT = int(os.environ.get(\"PORT\", \"8080\"))\nSTATIC_DIR = os.environ.get(\"STATIC_DIR\", \"/app/static\")\nDB_PATH = os.environ.get(\"DB_PATH\"\

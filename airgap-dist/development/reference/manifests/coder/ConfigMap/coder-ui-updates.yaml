    \ + CHAT_TYPING_SECONDS\n            if fresh:\n                self.changed.notify_all()\n\n    def typing_to(self, user_id):\n        t = time.time()\n        return sorted(\n            f\n     \
    \       for (f, to), until in list(self.typing.items())\n            if to == user_id and until > t\n        )\n\n    def since(self, user_id, after):\n        with self.connect() as db:\n         \

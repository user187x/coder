    \ 4px;border-radius:4px', [document.createTextNode(m[1])]) },\n  { re: /^\\*\\*(.+?)\\*\\*/, tag: 'strong' },\n  { re: /^__(.+?)__/, tag: 'strong' },\n  { re: /^~~(.+?)~~/, tag: 's' },\n  { re: /^\\\
    *([^*\\s](?:[^*]*[^*\\s])?)\\*/, tag: 'em' },\n  { re: /^_([^_\\s](?:[^_]*[^_\\s])?)_(?![A-Za-z0-9])/, tag: 'em' },\n  { re: /^\\[([^\\]]+)\\]\\(([^)\\s]+)\\)/, node: (m) => {\n    const href = safeHref(m[2]);\n\
    \    if (!href) return document.createTextNode(m[0]);\n    const a = el('a', 'color:inherit;text-decoration:underline;font-weight:600', inline(m[1]));\n    a.href = href;\n    if (/^https?:/i.test(href))\
    \ { a.target = '_blank'; a.rel = 'noopener noreferrer'; }\n    return a;\n  } },\n];\n\nfunction el(tag, style, children) {\n  const node = document.createElement(tag);\n  if (style) node.style.cssText\
    \ = style;\n  node.append(...children);\n  return node;\n}\n\nexport function inline(text) {\n  const out = [];\n  let plain = '';\n  let i = 0;\n  const flush = () => { if (plain) { out.push(document.createTextNode(plain));\
    \ plain = ''; } };\n  outer: while (i < text.length) {\n    const rest = text.slice(i);\n    // a word character right before * or _ means it is part of a word (snake_case, 2*3), not emphasis\n    for\

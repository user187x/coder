  certificates.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Certificates \xB7 Coder</title>\n\
    \  <link rel=\"stylesheet\" href=\"/__coder-ui/view.css\">\n  <link rel=\"stylesheet\" href=\"/__coder-ui/certificates.css\">\n  <style id=\"coder-ui-theme\"></style>\n</head>\n<body>\n<main>\n  <section\
    \ class=\"card\" aria-labelledby=\"list-h\">\n    <div class=\"card-head\">\n      <h2 id=\"list-h\">Your certificate</h2>\n      <button type=\"button\" class=\"btn btn-primary\" id=\"add\">Upload\
    \ certificate\u2026</button>\n    </div>\n    <div id=\"list\"><p class=\"hint\">Loading\u2026</p></div>\n  </section>\n\n  <section class=\"card how\" aria-labelledby=\"how-h\">\n    <h2 id=\"how-h\"\
    >How it works</h2>\n    <ul>\n      <li>Every workspace you start gets your certificate as <code id=\"target\">~/.cert/&lt;username&gt;.p12</code>, named after your Coder username and readable only\
    \ by you (<code>0600</code>). Nothing else is placed in <code>~/.cert</code>. Restart a running workspace to pick up a new or replaced certificate.</li>\n      <li>It is stored as your own Coder secret:\
    \ only you can upload, replace or delete it, its contents can never be read back through Coder, and it is delivered only to workspaces you own. Every change is in Coder's audit log.</li>\n      <li>The\
    \ optional password check happens in this page only. The password is never sent or stored: keep using it wherever the certificate is opened.</li>\n    </ul>\n  </section>\n</main>\n\n<dialog id=\"dialog\"\
    \ aria-labelledby=\"dialog-h\">\n  <form method=\"dialog\" id=\"form\" autocomplete=\"off\">\n    <h2 id=\"dialog-h\">Upload your certificate</h2>\n    <label class=\"drop\" id=\"drop\" tabindex=\"\
    0\">\n      <input type=\"file\" id=\"file\" accept=\".p12,.pfx,application/x-pkcs12\">\n      <span id=\"drop-text\"><b>Choose a .p12 / .pfx file</b> or drop it here<br><small>PKCS#12, up to 18 KB</small></span>\n\
    \    </label>\n    <label class=\"field\"><span class=\"label\">Password <em>(optional, only to check the file)</em></span>\n      <input type=\"password\" id=\"password\" autocomplete=\"off\" data-1p-ignore\
    \ data-lpignore=\"true\" spellcheck=\"false\">\n      <span class=\"hint\">Checked here in your browser. Never sent or stored.</span></label>\n    <div class=\"facts\" id=\"facts\" hidden></div>\n \
    \   <div class=\"row actions end\">\n      <button type=\"button\" class=\"btn\" id=\"cancel\">Cancel</button>\n      <button type=\"button\" class=\"btn btn-primary\" id=\"save\" disabled>Upload</button>\n\
    \    </div>\n  </form>\n</dialog>\n<div id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\" hidden></div>\n<script type=\"module\" src=\"/__coder-ui/certificates-view.js\"></script>\n\
    </body>\n</html>\n"
  certinfo.py: "\"\"\"Certificates for General > Security (Python standard library only): reads X.509 certificates and private keys\n(PEM / DER) with a small ASN.1 reader, and probes TLS endpoints for the\
    \ versions and cipher suites they accept and the\nchain they present. Nothing here keeps or returns key material: a private key is reduced to its type, size and\nwhether it belongs to a certificate\
    \ next to it.\n\"\"\"\nimport base64\nimport hashlib\nimport re\nimport socket\nimport ssl\nimport struct\nfrom datetime import datetime, timezone\n\nOIDS = {\n    \"2.5.4.3\": \"CN\", \"2.5.4.10\"\
    : \"O\", \"2.5.4.11\": \"OU\", \"2.5.4.6\": \"C\", \"2.5.4.7\": \"L\", \"2.5.4.8\": \"ST\",\n    \"1.2.840.113549.1.9.1\": \"emailAddress\",\n    \"1.2.840.113549.1.1.1\": \"RSA\", \"1.2.840.10045.2.1\"\
    : \"EC\", \"1.3.101.112\": \"Ed25519\", \"1.3.101.113\": \"Ed448\",\n    \"1.2.840.113549.1.1.5\": \"SHA1-RSA\", \"1.2.840.113549.1.1.11\": \"SHA256-RSA\", \"1.2.840.113549.1.1.12\": \"SHA384-RSA\"\
    ,\n    \"1.2.840.113549.1.1.13\": \"SHA512-RSA\", \"1.2.840.113549.1.1.10\": \"RSA-PSS\",\n    \"1.2.840.10045.4.3.2\": \"ECDSA-SHA256\", \"1.2.840.10045.4.3.3\": \"ECDSA-SHA384\", \"1.2.840.10045.4.3.4\"\
    : \"ECDSA-SHA512\",\n    \"1.2.840.10045.3.1.7\": \"P-256\", \"1.3.132.0.34\": \"P-384\", \"1.3.132.0.35\": \"P-521\",\n    \"1.3.6.1.5.5.7.3.1\": \"server auth\", \"1.3.6.1.5.5.7.3.2\": \"client auth\"\
    , \"1.3.6.1.5.5.7.3.3\": \"code signing\",\n    \"1.3.6.1.5.5.7.3.4\": \"e-mail protection\", \"1.3.6.1.5.5.7.3.9\": \"OCSP signing\",\n}\nKEY_USAGE = [\"digital signature\", \"non-repudiation\", \"\
    key encipherment\", \"data encipherment\", \"key agreement\",\n             \"certificate signing\", \"CRL signing\", \"encipher only\", \"decipher only\"]\n\n\n# ---------------------------------------------------------------------------\
    \ ASN.1 DER\ndef _tlv(data, i):\n    \"\"\"(tag, value start, value end) of the element at i.\"\"\"\n    tag = data[i]\n    i += 1\n    length = data[i]\n    i += 1\n    if length & 0x80:\n        n\
    \ = length & 0x7F\n        if n == 0 or n > 4:\n            raise ValueError(\"unsupported DER length\")\n        length = int.from_bytes(data[i:i + n], \"big\")\n        i += n\n    if i + length >\
    \ len(data):\n        raise ValueError(\"truncated DER\")\n    return tag, i, i + length\n\n\ndef _children(data, start, end):\n    out, i = [], start\n    while i < end:\n        tag, s, e = _tlv(data,\
    \ i)\n        out.append((tag, s, e))\n        i = e\n    return out\n\n\ndef _oid(b):\n    first = b[0]\n    parts = [str(min(first // 40, 2)), str(first - 40 * min(first // 40, 2))]\n    v = 0\n \
    \   for byte in b[1:]:\n        v = (v << 7) | (byte & 0x7F)\n        if not byte & 0x80:\n            parts.append(str(v))\n            v = 0\n    return \".\".join(parts)\n\n\ndef _text(tag, b):\n\
    \    if tag == 0x1E:   # BMPString\n        return b.decode(\"utf-16-be\", \"replace\")\n    return b.decode(\"utf-8\", \"replace\")\n\n\ndef _time(tag, b):\n    s = b.decode(\"ascii\")\n    if tag\
    \ == 0x17:   # UTCTime YYMMDDHHMMSSZ\n        year = int(s[:2])\n        s = (\"19\" if year >= 50 else \"20\") + s\n    return datetime.strptime(s[:14], \"%Y%m%d%H%M%S\").replace(tzinfo=timezone.utc)\n\
    \n\ndef _name(data, s, e):\n    parts = []\n    for _, rs, re_ in _children(data, s, e):            # RDN SET\n        for _, as_, ae in _children(data, rs, re_):     # AttributeTypeAndValue SEQ\n \

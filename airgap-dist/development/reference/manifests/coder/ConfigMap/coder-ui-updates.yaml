    \ var(--danger); }\n.node-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }\n.node-name { font-weight: 600; font-size: 15px; }\n.node-meta { display:\
    \ grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 12px; }\n.node-meta dt { color: var(--muted); }\n.node-meta dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap:\
    \ anywhere; }\n.meter { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; }\n.meter .bar { position: relative; height: 8px; border-radius:\
    \ 4px; background: hsl(var(--coder-surface-tertiary)); overflow: hidden; }\n.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--link); }\n.meter .req { position:\
    \ absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .55; }\n.meter.hot .fill { background: var(--danger); }\n.meter .val { color: var(--muted); font-variant-numeric: tabular-nums;\

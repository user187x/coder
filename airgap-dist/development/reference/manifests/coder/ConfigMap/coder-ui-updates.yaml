    \  tick(banner);\n}\n\nexport function hasCountdown(text) { return COUNTDOWN_ALL.test(text || '') && !(COUNTDOWN_ALL.lastIndex = 0); }\n"
  certificates-view.js: "// Settings > Certificates: the user's PKCS#12 certificate, installed into their workspaces as ~/.cert/<username>.p12.\n//\n// The browser talks to Coder's own user-secrets API\
    \ with the user's session; nothing passes through\n// coder-ui-updates. The certificate is one Coder secret: value = the file, base64-encoded (secret values are text),\n// file_path = ~/.cert/.<username>.p12.b64.\
    \ Coder's agent writes it into the owner's workspaces when they start and the\n// template's installer (workspace-certificates.tf) decodes it to ~/.cert/<username>.p12 with mode 0600.\n// One certificate\
    \ per user: a certificate saved under another name (earlier versions of this page let users pick\n// one, and users can be renamed) is moved to the username's path when the page loads; any further ones\
    \ are listed\n// as not installed so they can be deleted.\n// Coder never returns secret values, so this page shows what it can see: description and dates.\nimport { certificates, checkPassword, inspect,\
    \ Pkcs12Error, sha256 } from './pkcs12.js';\n\nconst API = '/api/v2/users/me/secrets';\nconst MAX_BYTES = 18 * 1024; // base64 of this fits Coder's 24 KiB limit for one secret value\nconst PATH_RE =\
    \ /^~\\/\\.cert\\/\\.([A-Za-z0-9_@+-][A-Za-z0-9._@+-]*)\\.p12\\.b64$/;\nconst secretName = (name) => `certificate-${name}`;\nconst pathFor = (name) => `~/.cert/.${name}.p12.b64`;\nconst $ = (id) =>\
    \ document.getElementById(id);\n\nlet username = '';\nlet current = null; // the certificate installed in the workspaces\nlet extras = []; // certificates under other names, not installed\nlet pending\
    \ = null; // {bytes, info, sha, base64}\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElement(tag);\n  for (const [k, v] of Object.entries(attrs)) {\n    if (k === 'class')\
    \ node.className = v;\n    else if (k === 'text') node.textContent = v;\n    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);\n  }\n  node.append(...children.filter((c)\
    \ => c !== null && c !== undefined && c !== false));\n  return node;\n}\n\nfunction toast(text, isError) {\n  const t = $('toast');\n  t.textContent = text;\n  t.classList.toggle('error', !!isError);\n\
    \  t.hidden = false;\n  clearTimeout(toast.timer);\n  toast.timer = setTimeout(() => { t.hidden = true; }, 6000);\n}\n\n// Coder's API expects the dashboard's CSRF token with cookie-authenticated changes\
    \ (the dashboard sends it too).\nfunction csrf() {\n  try {\n    return window.parent.document.querySelector('meta[property=\"csrf-token\"]')?.getAttribute('content') || '';\n  } catch { return '';\
    \ }\n}\n\nasync function api(method, path = '', body) {\n  const res = await fetch(API + path, {\n    method, credentials: 'same-origin', cache: 'no-store',\n    headers: { Accept: 'application/json',\
    \ ...(body ? { 'Content-Type': 'application/json' } : {}), 'X-CSRF-TOKEN': csrf() },\n    body: body ? JSON.stringify(body) : undefined,\n  });\n  const data = res.status === 204 ? null : await res.json().catch(()\
    \ => null);\n  if (!res.ok) {\n    const detail = data?.validations?.map((v) => v.detail).join(' ') || data?.detail || '';\n    throw new Error([data?.message || `HTTP ${res.status}`, detail].filter(Boolean).join(':\
    \ '));\n  }\n  return data;\n}\n\nconst fmtDate = (d) => (d ? new Date(d).toLocaleDateString(undefined, { dateStyle: 'medium' }) : '\u2014');\nconst daysLeft = (d) => Math.floor((new Date(d) - Date.now())\
    \ / 86400000);\n\n// What the description carries (no secrets): subject, expiry and fingerprint, so the list can show them.\nfunction describe(name, facts) {\n  const parts = [`PKCS#12 certificate,\
    \ installed as ~/.cert/${name}.p12`];\n  if (facts.subject) parts.push(`subject ${facts.subject}`);\n  if (facts.notAfter) parts.push(`expires ${facts.notAfter.toISOString().slice(0, 10)}`);\n  parts.push(`sha256\
    \ ${facts.sha.slice(0, 16)}`);\n  return parts.join(' \xB7 ');\n}\n\nfunction parseDescription(d) {\n  return {\n    subject: /subject ([^\xB7]+?)(?: \xB7|$)/.exec(d || '')?.[1],\n    expires: /expires\
    \ (\\d{4}-\\d\\d-\\d\\d)/.exec(d || '')?.[1],\n    sha: /sha256 ([0-9a-f]{16})/.exec(d || '')?.[1],\n  };\n}\n\n// ------------------------------------------------------------------ list\nfunction row(c,\
    \ installed) {\n  const d = parseDescription(c.description);\n  const left = d.expires ? daysLeft(d.expires) : null;\n  const expiry = d.expires\n    ? el('span', {}, fmtDate(d.expires), left < 0 ?\
    \ el('span', { class: 'badge error', text: 'expired' }) : left <= 30 ? el('span', { class: 'badge warn', text: `${left} days left` }) : null)\n    : el('span', { class: 'sub', text: 'unknown' });\n\
    \  const remove = el('button', { type: 'button', class: 'btn btn-small btn-danger-quiet', text: 'Delete' });\n  remove.addEventListener('click', () => removeCert(c, installed));\n  let replace = null;\n\
    \  if (installed) {\n    replace = el('button', { type: 'button', class: 'btn btn-small', text: 'Replace\u2026' });\n    replace.addEventListener('click', openDialog);\n  }\n  return el('tr', {},\n\
    \    el('td', {}, installed ? el('code', { text: `~/.cert/${username}.p12` }) : el('span', {}, el('code', { text: `${c.cert}.p12` }), el('span', { class: 'badge muted', text: 'not installed' })),\n\
    \      installed && !c.enabled ? el('span', { class: 'badge muted', text: 'disabled' }) : null,\n      el('span', { class: 'sub', text: d.sha ? `SHA-256 ${d.sha}\u2026` : '' })),\n    el('td', { text:\
    \ d.subject || '\u2014' }),\n    el('td', {}, expiry),\n    el('td', { text: fmtDate(c.updated_at) }),\n    el('td', { class: 'actions' }, replace, remove));\n}\n\nfunction render() {\n  $('add').textContent\
    \ = current ? 'Replace certificate\u2026' : 'Upload certificate\u2026';\n  $('target').textContent = `~/.cert/${username}.p12`;\n  if (!current && !extras.length) {\n    $('list').replaceChildren(el('p',\
    \ { class: 'empty', text: `No certificate yet. Upload your .p12 and every workspace you start has it as ~/.cert/${username}.p12.` }));\n    return;\n  }\n  const rows = [current && row(current, true),\
    \ ...extras.map((c) => row(c, false))].filter(Boolean);\n  $('list').replaceChildren(el('table', {},\n    el('thead', {}, el('tr', {}, ...['In your workspaces', 'Certificate', 'Expires', 'Updated',\
    \ ''].map((h) => el('th', { scope: 'col', text: h })))),\n    el('tbody', {}, ...rows)),\n    extras.length ? el('p', { class: 'hint', text: `Only ~/.cert/${username}.p12 is installed. Certificates\
    \ saved under other names are not; delete them.` }) : '');\n}\n\nasync function load() {\n  try {\n    if (!username) username = (await (await fetch('/api/v2/users/me', { credentials: 'same-origin',\
    \ cache: 'no-store' })).json()).username;\n    const all = await api('GET');\n    const certs = (all || []).map((s) => ({ ...s, cert: PATH_RE.exec(s.file_path || '')?.[1] })).filter((s) => s.cert)\n\
    \      .sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));\n    current = certs.find((c) => c.cert === username) || null;\n    if (!current && certs.length) {\n      // Saved under\
    \ another name: install it as ~/.cert/<username>.p12 from now on (the newest, if several).\n      const c = certs[0];\n      const d = parseDescription(c.description);\n      const facts = { sha: d.sha\
    \ || '', subject: d.subject, notAfter: d.expires ? new Date(d.expires) : null };\n      current = await api('PATCH', '/' + encodeURIComponent(c.name), { file_path: pathFor(username), description: describe(username,\
    \ facts) });\n      current = { ...c, ...current, cert: username };\n      toast(`${c.cert}.p12 is now installed as ~/.cert/${username}.p12. Restart your workspaces to apply.`);\n    }\n    extras =\
    \ certs.filter((c) => current && c.name !== current.name);\n    render();\n  } catch (e) {\n    $('list').replaceChildren(el('p', { class: 'empty', text: `Could not load your certificate: ${e.message}`\
    \ }));\n  }\n}\n\nasync function removeCert(c, installed) {\n  const what = installed ? `~/.cert/${username}.p12` : `${c.cert}.p12 (not installed)`;\n  if (!window.confirm(`Delete ${what}?${installed\
    \ ? '\\n\\nIt is removed from your workspaces the next time each one starts.' : ''}`)) return;\n  try {\n    await api('DELETE', '/' + encodeURIComponent(c.name));\n    toast(installed ? `Deleted ~/.cert/${username}.p12.\
    \ Restart your workspaces to remove it from them.` : `Deleted ${c.cert}.p12.`);\n    load();\n  } catch (e) {\n    toast(e.message, true);\n  }\n}\n\n// ------------------------------------------------------------------\
    \ add / replace\nfunction fact(k, v, kind = '') { return el('div', { class: `fact ${kind}` }, el('span', { class: 'k', text: k }), el('span', { class: 'v', text: v })); }\n\nasync function analyse()\
    \ {\n  const facts = $('facts');\n  if (!pending) { facts.hidden = true; return; }\n  const { info, bytes } = pending;\n  const out = [fact('File', `PKCS#12, ${(bytes.length / 1024).toFixed(1)} KB,\
    \ SHA-256 ${pending.sha.slice(0, 16)}\u2026`, 'ok')];\n  out.push(fact('Private key', info.hasKey ? 'included' : 'not visible (encrypted, or certificate only)'));\n  const legacy = info.encryption.filter((e)\
    \ => /legacy/.test(e));\n  out.push(fact('Protection', `${info.encryption.join(', ') || 'none'}${info.mac ? `; integrity ${info.mac}` : ''}`, legacy.length ? 'warn' : 'ok'));\n  if (legacy.length) out.push(fact('',\
    \ 'Legacy encryption: consider re-exporting with AES (e.g. openssl pkcs12 -export without -legacy).', 'warn'));\n  pending.details = null;\n  const pw = $('password').value;\n  if (pw || info.mac) {\n\
    \    try {\n      const ok = await checkPassword(bytes, pw);\n      if (pw || ok) out.push(fact('Password', ok === null ? 'cannot be checked here (PBMAC1)' : ok ? 'correct' : 'does not match this file',\
    \ ok === false ? 'error' : ok ? 'ok' : ''));\n      if (ok) {\n        const list = await certificates(bytes, pw).catch(() => null);\n        if (Array.isArray(list) && list.length) {\n          const\
    \ leaf = list[0];\n          pending.details = leaf;\n          const left = daysLeft(leaf.notAfter);\n          out.push(fact('Subject', leaf.subject));\n          out.push(fact('Issued by', leaf.issuer));\n\
    \          out.push(fact('Valid until', `${leaf.notAfter.toLocaleDateString(undefined, { dateStyle: 'medium' })}${left < 0 ? ' (expired)' : left <= 30 ? ` (${left} days left)` : ''}`,\n            left\
    \ < 0 ? 'error' : left <= 30 ? 'warn' : 'ok'));\n        } else if (list && list.legacy) {\n          out.push(fact('Details', `not readable here (${list.legacy})`));\n        }\n      }\n    } catch\
    \ { /* details are optional */ }\n  }\n  if (!pw) out.push(fact('', 'Enter the password to check it and see who the certificate is for (optional).'));\n  facts.replaceChildren(...out);\n  facts.hidden\
    \ = false;\n}\n\nasync function pick(file) {\n  pending = null;\n  $('save').disabled = true;\n  if (!file) { analyse(); return; }\n  const bytes = new Uint8Array(await file.arrayBuffer());\n  $('drop-text').replaceChildren(el('b',\
    \ { text: file.name }), ' \xB7 choose another or drop it here');\n  try {\n    if (bytes.length > MAX_BYTES) throw new Pkcs12Error(`The file is ${(bytes.length / 1024).toFixed(1)} KB; the limit is 18\
    \ KB.`);\n    const info = inspect(bytes);\n    let bin = '';\n    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));\n    pending = { bytes,\
    \ info, sha: await sha256(bytes), base64: btoa(bin) };\n  } catch (e) {\n    $('facts').replaceChildren(fact('File', e instanceof Pkcs12Error ? e.message : 'This file cannot be read.', 'error'));\n\
    \    $('facts').hidden = false;\n    return;\n  }\n  await analyse();\n  $('save').disabled = !pending;\n}\n\n// The frame is as tall as its page, so a centred dialog could sit below the fold or under\
    \ Coder's bottom bars. Keep it\n// inside the part of the frame that is on screen: top of the visible area, at most its height (the dialog's content\n// scrolls, its buttons stay at the bottom), re-fitted\
    \ while the dashboard scrolls or resizes.\nfunction fitDialog(dialog) {\n  try {\n    const r = window.frameElement.getBoundingClientRect();\n    const vh = window.parent.innerHeight;\n    const bottomBars\
    \ = [...window.parent.document.querySelectorAll('.sticky.bottom-0, #coder-classification-bottom')]\n      .reduce((h, e) => Math.max(h, vh - e.getBoundingClientRect().top), 0);\n    const top = Math.max(0,\
    \ -r.top);\n    const visible = Math.min(vh - bottomBars, r.bottom) - Math.max(0, r.top);\n    dialog.style.marginTop = `${top + 12}px`;\n    dialog.style.maxHeight = `${Math.max(280, visible - 24)}px`;\n\
    \  } catch { /* not inside Coder */ }\n}\nfunction revealDialog() {\n  const dialog = document.querySelector('dialog');\n  fitDialog(dialog);\n  const refit = () => (dialog.open ? fitDialog(dialog)\
    \ : window.parent.removeEventListener('scroll', refit));\n  try {\n    window.parent.addEventListener('scroll', refit, { passive: true });\n    window.parent.addEventListener('resize', refit, { passive:\
    \ true });\n  } catch { /* not inside Coder */ }\n}\n\nfunction openDialog() {\n  pending = null;\n  $('file').value = '';\n  $('password').value = '';\n  $('dialog-h').textContent = `${current ? 'Replace'\
    \ : 'Upload'} ~/.cert/${username}.p12`;\n  $('save').textContent = current ? 'Replace' : 'Upload';\n  $('drop-text').innerHTML = '<b>Choose a .p12 / .pfx file</b> or drop it here<br><small>PKCS#12,\
    \ up to 18 KB</small>';\n  $('facts').hidden = true;\n  $('save').disabled = true;\n  $('dialog').showModal();\n  revealDialog();\n}\n\nasync function save() {\n  if (!pending || !username) return;\n\
    \  const facts = { sha: pending.sha, subject: pending.details?.subject, notAfter: pending.details?.notAfter };\n  const body = { value: pending.base64, description: describe(username, facts), file_path:\
    \ pathFor(username) };\n  const replaced = !!current;\n  $('save').disabled = true;\n  try {\n    if (current && current.name === secretName(username)) {\n      await api('PATCH', '/' + encodeURIComponent(current.name),\
    \ { ...body, enabled: true });\n    } else {\n      // New, or replacing one whose secret still carries an older name: store it as certificate-<username>.\n      if (current) await api('PATCH', '/'\
    \ + encodeURIComponent(current.name), { file_path: pathFor(`${current.cert}.replaced`) });\n      try {\n        await api('POST', '', { name: secretName(username), ...body });\n      } catch (e) {\n\
    \        if (current) await api('PATCH', '/' + encodeURIComponent(current.name), { file_path: pathFor(username) }).catch(() => {});\n        throw e;\n      }\n      if (current) await api('DELETE',\
    \ '/' + encodeURIComponent(current.name));\n    }\n    pending = null; // drop the file from memory\n    $('password').value = '';\n    $('dialog').close();\n    toast(`${replaced ? 'Replaced' : 'Uploaded'}\
    \ ~/.cert/${username}.p12. Workspaces you start from now on have it; restart running ones.`);\n    load();\n  } catch (e) {\n    toast(e.message, true);\n    $('save').disabled = false;\n  }\n}\n\n\
    $('add').addEventListener('click', openDialog);\n$('cancel').addEventListener('click', () => { pending = null; $('password').value = ''; $('dialog').close(); });\n$('dialog').addEventListener('close',\
    \ () => { pending = null; $('password').value = ''; });\n$('file').addEventListener('change', () => pick($('file').files[0]));\nlet timer = null;\n$('password').addEventListener('input', () => { clearTimeout(timer);\
    \ timer = setTimeout(analyse, 350); });\n$('save').addEventListener('click', save);\nconst drop = $('drop');\ndrop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over');\
    \ });\ndrop.addEventListener('dragleave', () => drop.classList.remove('over'));\ndrop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]);\
    \ });\ndrop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });\n\nload();\n"
  certificates.css: "code { font-family: ui-monospace, monospace; font-size: 12px; }\n.how ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }\ntable\
    \ { width: 100%; border-collapse: collapse; font-size: 13px; }\nth { text-align: left; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }\ntd { padding:\
    \ 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }\ntbody tr:last-child td { border-bottom: 0; }\ntd .sub { display: block; color: var(--muted); font-size:\
    \ 12px; margin-top: 2px; }\ntd.actions { white-space: nowrap; text-align: right; }\ntd.actions .btn { margin-left: 6px; }\n.btn-danger-quiet { color: var(--danger); }\n.btn-danger-quiet:hover:not(:disabled)\
    \ { border-color: var(--danger); }\n.empty { color: var(--muted); padding: 18px 0 6px; text-align: center; }\n.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius:\
    \ 999px; border: 1px solid currentColor; margin-left: 6px; }\n.badge.warn { color: var(--warn); } .badge.error { color: var(--danger); } .badge.ok { color: var(--ok); } .badge.muted { color: var(--muted);\
    \ }\ndialog { width: min(680px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin: 16px auto auto;\n  background: hsl(var(--coder-surface-secondary, 240\
    \ 6% 10%)); color: var(--text); box-shadow: 0 24px 64px rgb(0 0 0 / .45); }\ndialog::backdrop { background: rgb(0 0 0 / .55); }\ndialog h2 { margin-bottom: 16px; }\nbody:has(dialog[open]) { min-height:\
    \ 760px; }\n.drop { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 110px; padding: 16px; margin-bottom: 16px;\n  border: 2px dashed hsl(var(--coder-border-secondary,\
    \ var(--coder-border-default))); border-radius: 10px; cursor: pointer; }\n.drop:hover, .drop.over, .drop:focus-visible { border-color: var(--link); outline: none; }\n.drop input { position: absolute;\
    \ width: 1px; height: 1px; opacity: 0; }\n.drop small { color: var(--muted); }\n.label em { color: var(--muted); font-weight: 400; font-style: normal; }\ninput[type=password] { width: 100%; padding:\
    \ 8px 11px; border: 1px solid hsl(var(--coder-border-secondary, var(--coder-border-default)));\n  border-radius: 6px; background: transparent; color: var(--text); font: inherit; }\n.field .hint { display:\

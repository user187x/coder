  keycloak.css: ".status-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }\n.big-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; background: var(--muted);\
    \ }\n.big-dot.ok { background: var(--ok); } .big-dot.warn { background: var(--warn); } .big-dot.error { background: var(--danger); }\n.facts { display: grid; grid-template-columns: max-content minmax(0,\
    \ 1fr); gap: 6px 18px; margin: 0 0 18px; font-size: 13px; }\n.facts dt { color: var(--muted); }\n.facts dd { margin: 0; overflow-wrap: anywhere; }\n.group { margin-bottom: 20px; }\n.group:last-child\
    \ { margin-bottom: 0; }\n.group h3 { margin-bottom: 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }\n.check { display: grid; grid-template-columns: 96px\
    \ minmax(0, 1fr) auto; gap: 4px 14px; align-items: start;\n  padding: 12px 0; border-top: 1px solid var(--border); }\n.check:first-of-type { border-top: 0; }\n.check .pill { justify-self: start; margin-top:\
    \ 1px; }\n.check-title { font-weight: 600; }\n.check-values { font-size: 13px; overflow-wrap: anywhere; }\n.check-values .now { color: var(--muted); }\n.check-values .arrow { color: var(--muted); margin:\
    \ 0 6px; }\n.check-values .want { color: var(--ok); }\n.check-detail { grid-column: 2 / 3; font-size: 13px; color: var(--muted); }\n.check .fix { grid-row: 1 / span 2; grid-column: 3; }\n.diffs { grid-column:\

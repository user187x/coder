    \ => ({}));\n  if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);\n  return out;\n}\n\nconst asDataUrl = (file) => new Promise((ok, bad) => {\n  const r = new FileReader();\n  r.onload\

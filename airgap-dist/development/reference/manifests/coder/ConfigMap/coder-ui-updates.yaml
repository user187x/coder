  avatar.js: "// User menu > \"Avatar\": pick any picture as your own avatar. The browser crops it to its centre square and scales it\n// to 256 px (WebP, else PNG), so every format the browser can show\
    \ works and the stored file stays small. A GIF is\n// uploaded as it is (up to 2 MB) so it stays animated; the circle crop is done by CSS (object-fit: cover). The\n// coder-ui-updates service keeps\
    \ it in Coder's own database (coder_ui_updates.avatar). Coder's avatar component\n// (rewritten Avatar chunk) shows it wherever Coder shows that user's avatar by username (user menu, workspace\n// lists,\
    \ ...) as a circle inside Coder's rounded square.\nconst API = '/__coder-ui/api/avatar';\nconst SIZE = 256;\nconst MAX_INPUT = 25 * 1024 * 1024;\nconst MAX_GIF = 2 * 1024 * 1024;\nlet dialog = null;\n\
    let state = { username: '', current: null, next: null };\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElement(tag);\n  for (const [k, v] of Object.entries(attrs)) {\n\
    \    if (k === 'class') node.className = v;\n    else if (k === 'text') node.textContent = v;\n    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);\n\
    \  }\n  node.append(...children.filter(Boolean));\n  return node;\n}\n\nfunction css() {\n  if (document.getElementById('coder-ui-avatar-css')) return;\n  const link = el('link', { id: 'coder-ui-avatar-css',\

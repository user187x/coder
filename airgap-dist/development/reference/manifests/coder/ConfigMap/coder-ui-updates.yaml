    \ wrap; gap: 6px; }\n.chip { position: relative; display: inline-flex; flex-direction: column; gap: 1px; max-width: 100%; padding: 5px 9px 5px 12px; border: 1px solid var(--border);\n  border-radius:\
    \ 6px; background: var(--raised); font-size: 12px; line-height: 1.3; min-width: 0; }\n.chip::before { content: \"\"; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px;\

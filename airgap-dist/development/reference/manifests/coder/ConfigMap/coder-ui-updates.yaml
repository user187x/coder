    \ [ -r /proc/self/environ ]; then case \"$(tr \"\\\\000\" \" \" <\"/proc/$p/environ\" 2>/dev/null)\" in *\"CODER_UI_TERMINAL=${id} \"*) ;; *) exit 0;; esac; fi; `\n  + `kill -HUP \"$p\" 2>/dev/null\

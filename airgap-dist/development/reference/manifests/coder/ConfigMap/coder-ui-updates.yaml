    \ in the master realm with only the roles needed for Coder's realm (view the realm,\n      view and manage clients, view and look up users). Delete that client in Keycloak to revoke access.</p>\n  \
    \  <form id=\"connect-form\" class=\"grid2\" autocomplete=\"off\">\n      <label class=\"field\"><span class=\"label\">Keycloak admin username</span><input type=\"text\" name=\"username\" autocomplete=\"\
    username\" required><span class=\"suggest\" id=\"connect-user-note\"></span></label>\n      <label class=\"field\"><span class=\"label\">Password</span><input type=\"password\" name=\"password\" autocomplete=\"\
    current-password\" required></label>\n      <div class=\"row\"><button type=\"submit\" class=\"btn btn-primary\">Connect</button><span class=\"hint\" id=\"connect-links\"></span></div>\n    </form>\n\
    \  </section>\n\n  <section class=\"card\" aria-labelledby=\"checks-h\">\n    <div class=\"card-head\"><h2 id=\"checks-h\">What was found</h2><span class=\"hint\" id=\"checked-at\"></span></div>\n \
    \   <div id=\"checks\"><p class=\"hint\">Loading\u2026</p></div>\n  </section>\n\n  <section class=\"card\" aria-labelledby=\"settings-h\">\n    <div class=\"card-head\"><h2 id=\"settings-h\">Settings</h2><span\

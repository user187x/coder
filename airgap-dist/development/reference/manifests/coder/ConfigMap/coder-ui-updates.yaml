  account-avatar.js: "// Settings > Account: your avatar, large, above Email / Username / Name (the rewritten Account page mounts it). It shows\n// what Coder shows for you everywhere (your uploaded picture,\
    \ else Coder's own (OIDC) picture, else the default avatar,\n// else your initials); the pencil badge says it can be changed, and a click opens the same dialog as User menu > Avatar.\n\nfunction el(tag,\
    \ attrs = {}, ...children) {\n  const node = document.createElement(tag);\n  for (const [k, v] of Object.entries(attrs)) {\n    if (k === 'class') node.className = v;\n    else if (k === 'text') node.textContent\
    \ = v;\n    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);\n  }\n  node.append(...children.filter(Boolean));\n  return node;\n}\n\nfunction css() {\n\
    \  if (document.getElementById('coder-ui-avatar-css')) return;\n  document.head.append(el('link', { id: 'coder-ui-avatar-css', rel: 'stylesheet', href: new URL('avatar.css', import.meta.url).pathname\
    \ }));\n}\n\nconst PENCIL = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.17\
    \ 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z\"/><path d=\"m15 5 4 4\"/></svg>';\n\nexport async function mount(root) {\n  css();\n \
    \ const picture = el('span', { class: 'cui-acc-picture' });\n  const badge = el('span', { class: 'cui-acc-badge', 'aria-hidden': 'true' });\n  badge.innerHTML = PENCIL;\n  const button = el('button',\
    \ { type: 'button', class: 'cui-acc-avatar', 'aria-label': 'Change your avatar', title: 'Change your avatar' }, picture, badge);\n  const name = el('div', { class: 'cui-acc-name' });\n  const hint =\
    \ el('div', { class: 'cui-acc-hint', text: 'Click the picture to change it. It shows wherever Coder shows you.' });\n  root.replaceChildren(el('div', { class: 'cui-acc-row' }, button, el('div', { class:\
    \ 'cui-acc-text' }, name, hint)));\n  button.addEventListener('click', () => import('./avatar.js').then((m) => m.open()).catch(() => {}));\n\n  try {\n    const [mine, me] = await Promise.all([\n  \
    \    fetch('/__coder-ui/api/avatar', { credentials: 'same-origin', cache: 'no-store' }).then((r) => (r.ok ? r.json() : {})),\n      fetch('/api/v2/users/me', { credentials: 'same-origin', headers: {\
    \ Accept: 'application/json' } }).then((r) => (r.ok ? r.json() : {})),\n    ]);\n    const url = mine.url || me.avatar_url || mine.defaultUrl || null;\n    const label = me.name || me.username || mine.username\
    \ || '';\n    name.replaceChildren(el('strong', { text: label }), me.name && me.username ? el('span', { text: ` @${me.username}` }) : null);\n    if (url) {\n      picture.replaceChildren(el('img',\
    \ { src: url, alt: '' }));\n      root.classList.toggle('cui-acc-uploaded', !!mine.url);\n    } else {\n      picture.textContent = label.split(/[\\s._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase()\
    \ || '?';\n    }\n  } catch {\n    picture.textContent = '?';\n  }\n}\n"
  ack.js: "// Watches for the coder-banner announcement on every Coder page: draws it with Markdown, the live countdown and custom\n// colours (banner-enhance.js), replaces its \"\xD7\" with \"Confirm\"\
    , and tells the coder-ui-updates service who saw and who\n// confirmed which announcement, for the admins' Announcement view.\n//\n// Signed-out pages (the login page) get no button: a confirmation\
    \ has to be attributable to someone, and they will\n// see the announcement again with its Confirm button once signed in.\nimport { decorate, markConfirmed, render } from './banner-enhance.js';\n\n\
    const API = '/__coder-ui/api/';\nconst BANNER_ID = 'coder-system-banner';\nconst DISMISSED_KEY = 'coder-banner-dismissed'; // coder-banner's own localStorage key for a dismissed announcement\nconst\
    \ viewed = new Set();\nconst status = new Map(); // announcement id -> Promise<{signedIn, username, acked} | null>\n\n// Signed-in answers are remembered for the page's life; \"signed out\" is not (Coder\
    \ signs in without a reload).\nfunction me(id) {\n  if (!status.has(id)) {\n    const answer = fetch(API + 'me?id=' + encodeURIComponent(id), { credentials: 'same-origin', cache: 'no-store' })\n   \
    \   .then((res) => (res.ok ? res.json() : null))\n      .then((who) => (who && who.signedIn ? who : null))\n      .catch(() => null);\n    status.set(id, answer);\n    answer.then((who) => { if (!who)\
    \ status.delete(id); });\n  }\n  return status.get(id);\n}\n\n// coder-banner puts the announcement above #root on pages without Coder's navbar (the login page), and moves the\n// same element under\
    \ the navbar once the dashboard renders.\nconst onLoginPage = (banner) => banner.nextElementSibling && banner.nextElementSibling.id === 'root';\n\nfunction post(kind, id) {\n  return fetch(API + kind,\
    \ {\n    method: 'POST',\n    credentials: 'same-origin',\n    keepalive: true, // the banner disappears on confirm; the request must still go out\n    headers: { 'Content-Type': 'application/json',\
    \ 'X-Requested-With': 'coder-ui' },\n    body: JSON.stringify({ id }),\n  }).catch(() => {});\n}\n\nasync function handle(banner) {\n  banner.dataset.cui = '1';\n  render(banner);\n  const id = banner.dataset.bannerId;\n\
    \  if (!id) return;\n  const { button, dismissible } = decorate(banner, {\n    onConfirm: () => {\n      status.set(id, Promise.resolve({ signedIn: true, acked: true }));\n      post('ack', id);\n \
    \   },\n  });\n  button.style.visibility = 'hidden'; // until we know who is looking\n  const who = await me(id);\n  if (!who) { // signed out: no button; look again once the banner has moved into the\
    \ signed-in dashboard\n    button.style.display = 'none';\n    banner.dataset.cui = 'signed-out';\n    return;\n  }\n  button.style.display = '';\n  if (!banner.isConnected) return;\n  if (who.acked)\
    \ {\n    // Confirmed already (maybe in another browser): a dismissible announcement goes away here too.\n    if (dismissible) {\n      try { window.localStorage.setItem(DISMISSED_KEY, id); } catch\
    \ { /* the banner just stays */ }\n      banner.remove();\n      return;\n    }\n    markConfirmed(button);\n  }\n  button.style.visibility = '';\n  if (!viewed.has(id)) {\n    viewed.add(id);\n   \
    \ post('view', id);\n  }\n}\n\nfunction scan() {\n  const banner = document.getElementById(BANNER_ID);\n  if (!banner) return;\n  if (!banner.dataset.cui || (banner.dataset.cui === 'signed-out' && !onLoginPage(banner)))\
    \ handle(banner);\n}\n\nnew MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });\nscan();\n"
  admin-embed.js: "// Runs inside the Banner admin page when it is embedded as Coder's Deployment > Announcement view (views.js adds it\n// after the page's own scripts). The admin page itself is unchanged\
    \ and keeps working stand-alone; this rearranges it\n// and adds to it, and it drives the page's own form fields and buttons, so publishing, confirmations, errors and the\n// live status keep working\
    \ exactly as before:\n//\n//   top of \"What developers see\"   a visibility switch and an orange \"Show again to everyone\" button\n//   Colors                         the four styles as swatches,\
    \ plus custom background / text colours\n//   Message                        Markdown with a Write / Preview toggle, the emoji picker and a live countdown\n//                                  underneath;\
    \ the lead-in and link fields are gone (Markdown covers both)\n//   Acknowledgements               every announcement with who saw / confirmed it; each can be deleted\nimport {\n  COLORS_RE, colorsToken,\
    \ countdownToken, decorate, parseCountdown, render,\n} from './banner-enhance.js';\n\nconst $ = (id) => document.getElementById(id);\nconst API = '/__coder-ui/api/';\nconst REFRESH_MS = 15000;\nconst\
    \ LEVEL_COLOURS = { info: '#1e40af', success: '#166534', warning: '#b45309', critical: '#b91c1c' };\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElement(tag);\n  for\
    \ (const [k, v] of Object.entries(attrs)) {\n    if (k === 'class') node.className = v;\n    else if (k === 'text') node.textContent = v;\n    else if (v === true) node.setAttribute(k, '');\n    else\
    \ if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v);\n  }\n  node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));\n  return node;\n}\n\n// Change\
    \ one of the page's own fields the way typing would, so it recomputes \"unpublished changes\" and the preview.\nfunction setField(id, value) {\n  const field = $(id);\n  if (!field || field.value ===\
    \ value) return;\n  field.value = value;\n  field.dispatchEvent(new Event('input', { bubbles: true }));\n}\n\nfunction post(path, body) {\n  return fetch(API + path, {\n    method: 'POST', credentials:\
    \ 'same-origin', cache: 'no-store',\n    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'coder-ui' },\n    body: JSON.stringify(body),\n  }).then(async (res) => {\n    const data\
    \ = await res.json().catch(() => ({}));\n    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);\n    return data;\n  });\n}\n\nfunction toast(text, isError) {\n  const t = $('toast');\n\
    \  if (!t) return;\n  t.textContent = text;\n  t.classList.toggle('error', !!isError);\n  t.hidden = false;\n  clearTimeout(toast.timer);\n  toast.timer = setTimeout(() => { t.hidden = true; }, 4000);\n\
    }\n\nconst eyedropper = 'EyeDropper' in window;\nfunction pickWithEyedropper(input) {\n  new window.EyeDropper().open().then((r) => {\n    input.value = r.sRGBHex.slice(0, 7);\n    input.dispatchEvent(new\
    \ Event('input', { bubbles: true }));\n  }).catch(() => { /* cancelled */ });\n}\n\n// A colour control: swatch-style native picker (it has its own eyedropper in Chromium), an explicit eyedropper button\n\
    // where the browser supports one, and the hex value.\nfunction colourControl(label, value, onChange) {\n  const picker = el('input', { type: 'color', value, class: 'cui-color', 'aria-label': `${label}\
    \ colour` });\n  const hex = el('input', { type: 'text', value, class: 'cui-hex', maxlength: '7', spellcheck: 'false', 'aria-label': `${label} colour (hex)` });\n  const drop = eyedropper ? el('button',\
    \ { type: 'button', class: 'btn cui-drop', title: 'Pick a colour from the screen', 'aria-label': `Pick the ${label.toLowerCase()} colour from the screen`, text: '\U0001F4A7' }) : null;\n  const set\
    \ = (v, from) => {\n    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;\n    if (from !== picker) picker.value = v.toLowerCase();\n    if (from !== hex) hex.value = v.toLowerCase();\n    onChange(v.toLowerCase());\n\
    \  };\n  picker.addEventListener('input', () => set(picker.value, picker));\n  hex.addEventListener('input', () => set(hex.value.trim(), hex));\n  drop?.addEventListener('click', () => pickWithEyedropper(picker));\n\
    \  const wrap = el('div', { class: 'cui-colour-control' }, el('span', { class: 'label', text: label }), picker, drop, hex);\n  wrap.setValue = (v) => { picker.value = v; hex.value = v; };\n  return\
    \ wrap;\n}\n\n// ------------------------------------------------------------------ controls: visibility switch + \"show again\"\nfunction controls() {\n  const toggle = $('toggle');\n  const reappear\
    \ = $('reappear');\n  const card = $('preview-h') && $('preview-h').closest('.card');\n  if (!toggle || !reappear || !card) return;\n\n  const sw = el('input', { type: 'checkbox', role: 'switch', id:\
    \ 'cui-visible', 'aria-describedby': 'cui-visible-state' });\n  const state = el('span', { class: 'cui-switch-state', id: 'cui-visible-state' });\n  const switchLabel = el('label', { class: 'cui-switch',\
    \ for: 'cui-visible' }, sw,\n    el('span', { class: 'cui-track', 'aria-hidden': 'true' }, el('span', { class: 'cui-thumb' })),\n    el('span', { class: 'cui-switch-text', text: 'Show banner' }), state);\n\
    \  const force = el('button', { type: 'button', class: 'btn cui-force', id: 'cui-force', title: 'Force Banner Display',\n    text: 'Show again to everyone' });\n\n  const row = el('div', { class: 'cui-controls',\
    \ role: 'group', 'aria-label': 'Banner visibility' }, switchLabel, force);\n  card.prepend(row);\n  const note = $('reappear-note');\n  if (note) { note.classList.add('cui-note'); row.after(note); }\n\
    \n  const sync = () => {\n    const on = toggle.textContent.trim() === 'Hide banner';\n    sw.checked = on;\n    sw.disabled = toggle.disabled;\n    state.textContent = on ? 'On: developers see it'\
    \ : 'Off: hidden from everyone';\n    force.disabled = reappear.disabled;\n  };\n  new MutationObserver(sync).observe(toggle, { childList: true, characterData: true, subtree: true, attributes: true\
    \ });\n  new MutationObserver(sync).observe(reappear, { attributes: true });\n  sync();\n  sw.addEventListener('change', () => { sync(); toggle.click(); }); // the switch moves once the change is published\n\
    \  force.addEventListener('click', () => reappear.click()); // the page asks for confirmation itself\n}\n\n// ------------------------------------------------------------------ Colors: swatches + custom\
    \ colours\nlet colours = null;\nfunction colorsSection() {\n  const levels = $('levels');\n  const fieldset = levels && levels.closest('fieldset');\n  if (!fieldset) return;\n  const legend = fieldset.querySelector('legend');\n\
    \  if (legend) legend.textContent = 'Colors';\n  levels.classList.add('cui-swatches');\n  for (const label of levels.querySelectorAll('.level')) {\n    const value = label.querySelector('input').value;\n\
    \    label.title = `${label.textContent.trim()} (${LEVEL_COLOURS[value]})`;\n  }\n  const custom = el('input', { type: 'radio', name: 'cui-colour-mode', value: 'custom', id: 'cui-custom-swatch' });\n\
    \  const customLabel = el('label', { class: 'level level-custom', title: 'Custom colours' }, custom, el('span', { text: 'Custom' }));\n  levels.append(customLabel);\n\n  let bg = '#1e40af';\n  let fg\
    \ = '#ffffff';\n  const write = () => setField('title', colorsToken(bg, fg));\n  const bgCtl = colourControl('Background', bg, (v) => { bg = v; write(); });\n  const fgCtl = colourControl('Text', fg,\
    \ (v) => { fg = v; write(); });\n  const panel = el('div', { class: 'cui-custom-colours', hidden: true }, bgCtl, fgCtl);\n  fieldset.append(panel);\n\n  custom.addEventListener('change', () => {\n \
    \   const level = document.querySelector('input[name=level]:checked');\n    if (!COLORS_RE.test($('title').value)) bg = LEVEL_COLOURS[level ? level.value : 'info'];\n    bgCtl.setValue(bg); fgCtl.setValue(fg);\n\
    \    write();\n  });\n  // Picking one of the four styles again drops the custom colours.\n  levels.addEventListener('change', (e) => {\n    if (e.target.name === 'level' && COLORS_RE.test($('title').value))\
    \ setField('title', '');\n  });\n  // Follow the form (it is rewritten when the page loads or publishes).\n  colours = () => {\n    const m = COLORS_RE.exec($('title').value);\n    custom.checked =\
    \ !!m;\n    levels.classList.toggle('cui-custom-on', !!m);\n    panel.hidden = !m;\n    if (m) { bg = m[1].toLowerCase(); fg = m[2].toLowerCase(); bgCtl.setValue(bg); fgCtl.setValue(fg); }\n  };\n \
    \ colours();\n}\n\n// ------------------------------------------------------------------ Message: toolbar (emoji, countdown, preview)\nlet refreshPreviewPane = () => {};\nlet syncCountdown = () => {};\n\
    function messageEditor() {\n  const message = $('message');\n  if (!message) return;\n  const field = message.closest('.field');\n  let caret = null;\n  const remember = () => { caret = [message.selectionStart,\
    \ message.selectionEnd]; };\n  message.addEventListener('keyup', remember);\n  message.addEventListener('click', remember);\n  message.addEventListener('blur', remember);\n\n  // Write / Preview\n \
    \ const writeTab = el('button', { type: 'button', class: 'cui-tab', 'aria-pressed': 'true', text: 'Write' });\n  const previewTab = el('button', { type: 'button', class: 'cui-tab', 'aria-pressed': 'false',\
    \ text: 'Preview' });\n  const pane = el('div', { class: 'cui-md-preview preview-frame', hidden: true, 'aria-live': 'polite' });\n  const showPreview = (on) => {\n    writeTab.setAttribute('aria-pressed',\
    \ String(!on));\n    previewTab.setAttribute('aria-pressed', String(on));\n    message.hidden = on;\n    pane.hidden = !on;\n    if (on) refreshPreviewPane();\n  };\n  writeTab.addEventListener('click',\
    \ () => { showPreview(false); message.focus(); });\n  previewTab.addEventListener('click', () => showPreview(true));\n  refreshPreviewPane = () => {\n    if (pane.hidden || !window.__coderBannerPreview)\
    \ return;\n    const level = document.querySelector('input[name=level]:checked');\n    const banner = window.__coderBannerPreview.build({\n      enabled: true, level: level ? level.value : 'info', title:\
    \ $('title').value, message: message.value,\n      linkText: '', linkUrl: '', dismissible: $('dismissible').checked, effect: 'none',\n    });\n    pane.replaceChildren(banner);\n    render(banner);\n\
    \    decorate(banner);\n  };\n\n  // Emoji: the page's own picker, moved here from the (removed) lead-in field. It inserts into the message.\n  const emojiBtn = $('emoji-btn');\n  const emojiPop = $('emoji-pop');\n\
    \  const countdownBtn = el('button', { type: 'button', class: 'btn cui-tool', 'aria-expanded': 'false', 'aria-controls': 'cui-countdown', text: '\u23F1 Countdown' });\n  const tools = el('div', { class:\
    \ 'cui-toolbar' },\n    el('div', { class: 'cui-tools' }, emojiBtn, countdownBtn),\n    el('span', { class: 'cui-md-hint', text: 'Markdown: **bold** *italic* ~~strike~~ `code` [link](https://\u2026\
    )' }),\n    el('div', { class: 'cui-tabs', role: 'group', 'aria-label': 'Message view' }, writeTab, previewTab));\n  if (emojiBtn) { emojiBtn.textContent = '\U0001F600 Emoji'; emojiBtn.classList.add('cui-tool');\
    \ }\n  const holder = el('div', { class: 'cui-emoji-holder' }, tools);\n  if (emojiPop) holder.append(emojiPop);\n  message.after(pane);\n  field.after(holder);\n\n  // Countdown panel\n  const when\
    \ = el('input', { type: 'datetime-local', step: '60', id: 'cui-cd-when' });\n  const format = el('select', { id: 'cui-cd-format' },\n    el('option', { value: 'dhms', text: '2d 04h 12m 09s' }), el('option',\
    \ { value: 'clock', text: '52:12:09' }),\n    el('option', { value: 'words', text: '2 days, 4 hours' }));\n  const done = el('input', { type: 'text', id: 'cui-cd-done', maxlength: '60', value: 'now'\
    \ });\n  const insert = el('button', { type: 'button', class: 'btn btn-primary', text: 'Insert at cursor' });\n  const remove = el('button', { type: 'button', class: 'btn', text: 'Remove countdown'\
    \ });\n  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;\n  const nudges = el('div', { class: 'cui-nudges', role: 'group', 'aria-label': 'Adjust the time' },\n    ...[['\u22121h', -60],\
    \ ['\u221215m', -15], ['+15m', 15], ['+1h', 60], ['+1d', 1440]].map(([t, min]) =>\n      el('button', { type: 'button', class: 'chip', 'data-min': String(min), text: t })));\n  const panel = el('div',\
    \ { class: 'cui-countdown', id: 'cui-countdown', hidden: true },\n    el('div', { class: 'cui-cd-grid' },\n      el('label', { class: 'field' }, el('span', { class: 'label', text: `Counts down to (${zone})`\
    \ }), when),\n      el('label', { class: 'field' }, el('span', { class: 'label', text: 'Shown as' }), format),\n      el('label', { class: 'field' }, el('span', { class: 'label', text: 'At zero, show'\
    \ }), done)),\n    nudges,\n    el('div', { class: 'actions' }, insert, remove),\n    el('p', { class: 'hint', text: 'The timer ticks live in the banner. Adjusting it here updates the countdown in the\
    \ message; publish to send it out.' }));\n  holder.append(panel);\n  countdownBtn.addEventListener('click', () => {\n    panel.hidden = !panel.hidden;\n    countdownBtn.setAttribute('aria-expanded',\
    \ String(!panel.hidden));\n    if (!panel.hidden) syncCountdown();\n  });\n\n  const toLocalInput = (iso) => {\n    const d = new Date(iso);\n    if (Number.isNaN(d.getTime())) return '';\n    const\
    \ p = (n) => String(n).padStart(2, '0');\n    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;\n  };\n  const toIso = (local) => {\n    const\
    \ d = new Date(local);\n    return Number.isNaN(d.getTime()) ? null : d.toISOString().replace(/\\.\\d{3}Z$/, 'Z');\n  };\n  // The time input shows minutes; keep the exact target (seconds included)\
    \ while the input still shows it.\n  let exactTo = null;\n  const target = () => (exactTo && toLocalInput(exactTo) === when.value ? exactTo : toIso(when.value));\n  const token = () => {\n    const\
    \ to = target();\n    return to && countdownToken({ to, format: format.value, done: done.value.trim() || 'now' });\n  };\n  syncCountdown = () => {\n    const cd = parseCountdown(message.value);\n \
    \   insert.textContent = cd ? 'Update countdown' : 'Insert at cursor';\n    remove.hidden = !cd;\n    if (cd && document.activeElement !== when && document.activeElement !== done) {\n      exactTo =\
    \ cd.to;\n      when.value = toLocalInput(cd.to); format.value = cd.format; done.value = cd.done;\n    } else if (!cd && !when.value) {\n      const soon = new Date(Date.now() + 3600e3); soon.setMinutes(0,\
    \ 0, 0);\n      when.value = toLocalInput(soon.toISOString());\n    }\n  };\n  const replaceToken = () => {\n    const cd = parseCountdown(message.value);\n    const t = token();\n    if (!cd || !t)\
    \ return;\n    setField('message', message.value.slice(0, cd.index) + t + message.value.slice(cd.index + cd.length));\n  };\n  for (const input of [when, format, done]) input.addEventListener('input',\
    \ replaceToken);\n  nudges.addEventListener('click', (e) => {\n    const min = Number(e.target.dataset.min);\n    if (!min) return;\n    const d = new Date(target() || Date.now());\n    d.setMinutes(d.getMinutes()\
    \ + min);\n    exactTo = d.toISOString().replace(/\\.\\d{3}Z$/, 'Z');\n    when.value = toLocalInput(exactTo);\n    replaceToken();\n  });\n  insert.addEventListener('click', () => {\n    const t =\
    \ token();\n    if (!t) { toast('Pick the date and time the countdown runs to.', true); return; }\n    if (parseCountdown(message.value)) { replaceToken(); return; }\n    const [a, b] = caret || [message.value.length,\
    \ message.value.length];\n    const before = message.value.slice(0, a);\n    const after = message.value.slice(b);\n    const spaced = (before && !/\\s$/.test(before) ? ' ' : '') + t + (after && !/^\\\
    s/.test(after) ? ' ' : '');\n    if ((before + spaced + after).length > Number(message.maxLength || 400)) { toast('The message would be too long for a countdown.', true); return; }\n    setField('message',\
    \ before + spaced + after);\n    syncCountdown();\n  });\n  remove.addEventListener('click', () => {\n    const cd = parseCountdown(message.value);\n    if (!cd) return;\n    setField('message', (message.value.slice(0,\
    \ cd.index) + message.value.slice(cd.index + cd.length)).replace(/\\s{2,}/g, ' ').trim());\n    syncCountdown();\n  });\n}\n\n// ------------------------------------------------------------------ previews\

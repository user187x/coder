  network.css: "/* General > Network: the live cluster map. views.js sizes the frame to the page, so the frame itself never scrolls\n   (the SVG's curves can otherwise leave an empty scrollbar track); wide\
    \ tables scroll inside .scroll. */\nhtml { overflow: hidden; }\n.live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;\
    \ }\n.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }\n.live.paused .dot, .live.stale .dot { background:\
    \ var(--muted); animation: none; }\n.live.stale .dot { background: var(--warn); }\n@keyframes pulse { 0% { box-shadow: 0 0 0 0 hsl(var(--coder-content-success) / .5); } 70% { box-shadow: 0 0 0 6px transparent;\
    \ } 100% { box-shadow: 0 0 0 0 transparent; } }\n@media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } }\n\n.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,\
    \ 1fr)); gap: 12px; margin-bottom: 20px; }\n.tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }\n.tile .k { color: var(--muted); font-size: 12px; font-weight:\
    \ 500; }\n.tile .v { font-size: 22px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.tile .s { color: var(--muted);\
    \ font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n\n/* topology: the entry column on the left, one card per node; the SVG behind them draws the connections */\n.topology\
    \ { position: relative; display: grid; grid-template-columns: minmax(180px, 220px) minmax(0, 1fr); gap: 56px; align-items: start; }\n@media (max-width: 760px) { .topology { grid-template-columns: minmax(0,\
    \ 1fr); gap: 32px; } }\n.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }\n.links path { fill: none; stroke-width: 2; }\n.links\
    \ path.ok { stroke: hsl(var(--coder-content-success) / .7); }\n.links path.bad { stroke: hsl(var(--coder-content-warning) / .8); stroke-dasharray: 5 5; }\n.links path.entry { stroke: hsl(var(--coder-content-link)\
    \ / .6); }\n/* transparent cards: the lines run behind them and show between the chips (which are opaque) */\n.entry, .node { position: relative; z-index: 1; background: transparent; }\n.entry { border:\
    \ 1px dashed var(--border); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }\n.entry .host { font-weight: 600; word-break: break-all; }\n.nodes { display: grid; grid-template-columns:\

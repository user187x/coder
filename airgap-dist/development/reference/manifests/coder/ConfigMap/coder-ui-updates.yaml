  classification-view.js: "// Deployment > Classification: edits the top/bottom classification marking (shown by classification.js on every page).\nconst API = '/__coder-ui/api/classification';\nconst $\
    \ = (id) => document.getElementById(id);\n\n// Standard banner colours for US classification markings (background), as quick picks.\nconst BACKGROUNDS = [\n  ['UNCLASSIFIED', '#007a33'], ['CUI', '#502b85'],\
    \ ['CONFIDENTIAL', '#0033a0'],\n  ['SECRET', '#c8102e'], ['TOP SECRET', '#ff8c00'], ['TOP SECRET//SCI', '#fce83a'],\n];\nconst FOREGROUNDS = [['White', '#ffffff'], ['Black', '#000000']];\n\nlet saved\
    \ = null;\nlet form = null;\n\nfunction toast(text, isError) {\n  const t = $('toast');\n  t.textContent = text;\n  t.classList.toggle('error', !!isError);\n  t.hidden = false;\n  clearTimeout(toast.timer);\n\
    \  toast.timer = setTimeout(() => { t.hidden = true; }, 4000);\n}\n\n// WCAG contrast ratio, to warn about unreadable combinations.\nfunction luminance(hex) {\n  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i,\
    \ i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));\n  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];\n}\nfunction contrast(a, b) {\n  const [x, y] = [luminance(a),\
    \ luminance(b)].sort((p, q) => q - p);\n  return (x + 0.05) / (y + 0.05);\n}\n\nfunction swatches(container, list, key) {\n  for (const [name, hex] of list) {\n    const b = document.createElement('button');\n\
    \    b.type = 'button';\n    b.className = 'swatch';\n    b.style.background = hex;\n    b.title = `${name} (${hex})`;\n    b.setAttribute('aria-label', `${name} ${hex}`);\n    b.dataset.hex = hex;\n\
    \    b.addEventListener('click', () => {\n      form[key] = hex;\n      // A preset background also gets the text colour that marking normally uses.\n      if (key === 'background') form.color = hex\
    \ === '#fce83a' || hex === '#ff8c00' ? '#000000' : '#ffffff';\n      render();\n    });\n    container.append(b);\n  }\n}\n\nfunction same(a, b) {\n  return ['enabled', 'text', 'height', 'background',\
    \ 'color'].every((k) => a[k] === b[k]);\n}\n\nfunction render() {\n  $('enabled').checked = form.enabled;\n  $('enabled-state').textContent = form.enabled ? 'On' : 'Off';\n  if (document.activeElement\
    \ !== $('text')) $('text').value = form.text;\n  $('height').value = form.height;\n  $('height-out').textContent = `${form.height} px`;\n  for (const [id, key] of [['bg', 'background'], ['fg', 'color']])\
    \ {\n    $(id).value = form[key];\n    if (document.activeElement !== $(`${id}-hex`)) $(`${id}-hex`).value = form[key];\n  }\n  for (const b of document.querySelectorAll('#bg-swatches .swatch')) b.setAttribute('aria-pressed',\
    \ String(b.dataset.hex === form.background));\n  for (const b of document.querySelectorAll('#fg-swatches .swatch')) b.setAttribute('aria-pressed', String(b.dataset.hex === form.color));\n  const font\
    \ = Math.max(10, Math.min(20, Math.round(form.height * 0.55)));\n  for (const bar of [$('bar-top'), $('bar-bottom')]) {\n    bar.textContent = form.text || 'CLASSIFICATION';\n    Object.assign(bar.style,\
    \ { height: `${form.height}px`, lineHeight: `${form.height}px`, fontSize: `${font}px`, background: form.background, color: form.color });\n  }\n  document.querySelector('.mock').classList.toggle('off',\
    \ !form.enabled);\n  const ratio = contrast(form.background, form.color);\n  $('contrast').textContent = ratio < 4.5 ? `Low contrast (${ratio.toFixed(1)}:1): the text may be hard to read. 4.5:1 or more\
    \ is recommended.` : '';\n  const dirty = !same(form, saved);\n  $('save').disabled = !dirty;\n  $('revert').disabled = !dirty;\n  $('dirty').textContent = dirty ? 'Unsaved changes' : '';\n  if (form.enabled\
    \ && !form.text.trim()) $('dirty').textContent = 'Enter the classification text to turn the banners on.';\n}\n\nasync function load() {\n  const res = await fetch(API, { credentials: 'same-origin',\
    \ cache: 'no-store' });\n  saved = await res.json();\n  form = { ...saved };\n  $('meta').textContent = saved.updatedBy ? `Last changed by ${saved.updatedBy} on ${new Date(saved.updatedAt).toLocaleString()}.`\
    \ : 'Not set up yet.';\n  render();\n}\n\nasync function save() {\n  $('save').disabled = true;\n  try {\n    const res = await fetch(API, {\n      method: 'POST', credentials: 'same-origin',\n    \
    \  headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'coder-ui' },\n      body: JSON.stringify({ enabled: form.enabled, text: form.text.trim(), height: form.height, background: form.background,\
    \ color: form.color }),\n    });\n    const data = await res.json().catch(() => ({}));\n    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);\n    saved = data;\n    form = { ...data\
    \ };\n    $('meta').textContent = `Last changed by ${data.updatedBy} on ${new Date(data.updatedAt).toLocaleString()}.`;\n    toast(data.enabled ? 'Saved. Every Coder page shows the banners within 30\
    \ seconds.' : 'Saved. The banners are off.');\n    try { window.parent.__coderUiClassification?.refresh(); } catch { /* not inside Coder */ }\n  } catch (e) {\n    toast(e.message, true);\n  }\n  render();\n\
    }\n\nfunction bind() {\n  swatches($('bg-swatches'), BACKGROUNDS, 'background');\n  swatches($('fg-swatches'), FOREGROUNDS, 'color');\n  $('enabled').addEventListener('change', () => { form.enabled\

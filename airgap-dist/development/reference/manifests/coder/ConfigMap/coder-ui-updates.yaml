  pgwire.py: "\"\"\"A small PostgreSQL client in pure Python (standard library only), enough for coder-ui-updates:\n\n  - TLS when the server offers it (SSLRequest), verified against a CA file when one\
    \ is given\n  - SCRAM-SHA-256, MD5 and cleartext password authentication\n  - the extended query protocol with text parameters ($1, $2 ...): values are always sent as parameters, never\n    spliced\
    \ into SQL. bytes are sent as bytea hex; results come back as str (bytea as bytes), None for NULL.\n\n    db = Connection(\"postgresql://user:pass@host:5432/dbname\", cafile=\"/etc/ca.crt\")\n    rows\
    \ = db.query(\"SELECT id, name FROM t WHERE id = $1\", [42])\n\nA Connection is not thread-safe; Pool hands one out per call and reconnects after errors.\n\"\"\"\nimport base64\nimport hashlib\nimport\
    \ hmac\nimport os\nimport socket\nimport ssl\nimport struct\nimport threading\nimport urllib.parse\n\n\nclass PgError(Exception):\n    def __init__(self, fields):\n        self.fields = fields\n   \
    \     super().__init__(\"%s: %s\" % (fields.get(\"C\", \"?\"), fields.get(\"M\", \"error\")))\n\n\nclass Connection:\n    def __init__(self, url, cafile=None, timeout=10, application_name=\"coder-ui-updates\"\
    ):\n        u = urllib.parse.urlsplit(url)\n        self.user = urllib.parse.unquote(u.username or \"postgres\")\n        self.password = urllib.parse.unquote(u.password or \"\")\n        self.database\
    \ = (u.path or \"/\").lstrip(\"/\") or self.user\n        q = urllib.parse.parse_qs(u.query)\n        self.sslmode = (q.get(\"sslmode\") or [\"prefer\"])[0]\n        self.sock = socket.create_connection((u.hostname,\
    \ u.port or 5432), timeout=timeout)\n        self.buf = b\"\"\n        self._tls(u.hostname, cafile)\n        self._startup(application_name)\n\n    # ---- low level\n    def _send(self, kind, payload=b\"\
    \"):\n        self.sock.sendall((kind or b\"\") + struct.pack(\"!I\", len(payload) + 4) + payload)\n\n    def _recv_exact(self, n):\n        while len(self.buf) < n:\n            chunk = self.sock.recv(65536)\n\
    \            if not chunk:\n                raise ConnectionError(\"PostgreSQL closed the connection\")\n            self.buf += chunk\n        out, self.buf = self.buf[:n], self.buf[n:]\n        return\
    \ out\n\n    def _read(self):\n        kind = self._recv_exact(1)\n        (length,) = struct.unpack(\"!I\", self._recv_exact(4))\n        return kind, self._recv_exact(length - 4)\n\n    @staticmethod\n\
    \    def _fields(payload):\n        out = {}\n        for part in payload.split(b\"\\0\"):\n            if part:\n                out[chr(part[0])] = part[1:].decode(errors=\"replace\")\n        return\
    \ out\n\n    def _tls(self, host, cafile):\n        if self.sslmode == \"disable\":\n            return\n        self.sock.sendall(struct.pack(\"!II\", 8, 80877103))\n        answer = self._recv_exact(1)\n\
    \        if answer == b\"S\":\n            ctx = ssl.create_default_context(cafile=cafile) if cafile and os.path.exists(cafile) else ssl.create_default_context()\n            ctx.verify_flags &= ~getattr(ssl,\
    \ \"VERIFY_X509_STRICT\", 0)\n            if not (cafile and os.path.exists(cafile)):\n                ctx.check_hostname = False          # sslmode=require semantics: encrypted, not verified\n    \
    \            ctx.verify_mode = ssl.CERT_NONE\n            self.sock = ctx.wrap_socket(self.sock, server_hostname=host)\n        elif self.sslmode in (\"require\", \"verify-ca\", \"verify-full\"):\n\
    \            raise ConnectionError(\"the server does not offer TLS\")\n\n    def _startup(self, app):\n        params = b\"\".join(k.encode() + b\"\\0\" + v.encode() + b\"\\0\" for k, v in\n       \
    \                   ((\"user\", self.user), (\"database\", self.database), (\"application_name\", app), (\"client_encoding\", \"UTF8\")))\n        self._send(None, struct.pack(\"!I\", 196608) + params\
    \ + b\"\\0\")\n        while True:\n            kind, payload = self._read()\n            if kind == b\"R\":\n                self._auth(payload)\n            elif kind == b\"E\":\n                raise\
    \ PgError(self._fields(payload))\n            elif kind == b\"Z\":\n                return\n\n    def _auth(self, payload):\n        (code,) = struct.unpack(\"!I\", payload[:4])\n        if code ==\
    \ 0:\n            return\n        if code == 3:  # cleartext\n            self._send(b\"p\", self.password.encode() + b\"\\0\")\n        elif code == 5:  # md5\n            salt = payload[4:8]\n   \
    \         inner = hashlib.md5(self.password.encode() + self.user.encode()).hexdigest().encode()\n            self._send(b\"p\", b\"md5\" + hashlib.md5(inner + salt).hexdigest().encode() + b\"\\0\")\n\
    \        elif code == 10:  # SASL\n            mechs = payload[4:].split(b\"\\0\")\n            if b\"SCRAM-SHA-256\" not in mechs:\n                raise ConnectionError(\"no supported SASL mechanism\
    \ (%s)\" % mechs)\n            self._scram()\n        else:\n            raise ConnectionError(\"unsupported authentication method %d\" % code)\n\n    def _scram(self):\n        nonce = base64.b64encode(os.urandom(18)).decode()\n\
    \        first_bare = \"n=,r=\" + nonce\n        msg = (\"n,,\" + first_bare).encode()\n        self._send(b\"p\", b\"SCRAM-SHA-256\\0\" + struct.pack(\"!I\", len(msg)) + msg)\n        kind, payload\
    \ = self._read()\n        if kind == b\"E\":\n            raise PgError(self._fields(payload))\n        server_first = payload[4:].decode()\n        attrs = dict(p.split(\"=\", 1) for p in server_first.split(\"\
    ,\"))\n        if not attrs[\"r\"].startswith(nonce):\n            raise ConnectionError(\"SCRAM nonce mismatch\")\n        salted = hashlib.pbkdf2_hmac(\"sha256\", self.password.encode(), base64.b64decode(attrs[\"\
    s\"]), int(attrs[\"i\"]))\n        client_key = hmac.new(salted, b\"Client Key\", hashlib.sha256).digest()\n        stored_key = hashlib.sha256(client_key).digest()\n        final_bare = \"c=biws,r=\"\
    \ + attrs[\"r\"]\n        auth_message = \",\".join((first_bare, server_first, final_bare)).encode()\n        signature = hmac.new(stored_key, auth_message, hashlib.sha256).digest()\n        proof =\
    \ bytes(a ^ b for a, b in zip(client_key, signature))\n        server_key = hmac.new(salted, b\"Server Key\", hashlib.sha256).digest()\n        self.expected_server_signature = base64.b64encode(hmac.new(server_key,\
    \ auth_message, hashlib.sha256).digest()).decode()\n        self._send(b\"p\", (final_bare + \",p=\" + base64.b64encode(proof).decode()).encode())\n        kind, payload = self._read()\n        if kind\
    \ == b\"E\":\n            raise PgError(self._fields(payload))\n        final = payload[4:].decode()\n        if dict(p.split(\"=\", 1) for p in final.split(\",\")).get(\"v\") != self.expected_server_signature:\n\
    \            raise ConnectionError(\"SCRAM server signature mismatch\")\n\n    # ---- queries\n    @staticmethod\n    def _param(v):\n        if v is None:\n            return None\n        if isinstance(v,\
    \ (bytes, bytearray)):\n            return b\"\\\\x\" + bytes(v).hex().encode()\n        if isinstance(v, bool):\n            return b\"t\" if v else b\"f\"\n        return str(v).encode()\n\n    def\
    \ query(self, sql, params=()):\n        \"\"\"Runs one statement; returns a list of row tuples (empty for statements without rows).\"\"\"\n        enc = [self._param(p) for p in params]\n        parse\
    \ = b\"\\0\" + sql.encode() + b\"\\0\" + struct.pack(\"!H\", 0)\n        bind = b\"\\0\\0\" + struct.pack(\"!H\", 0) + struct.pack(\"!H\", len(enc))\n        for p in enc:\n            bind += struct.pack(\"\
    !i\", -1) if p is None else struct.pack(\"!I\", len(p)) + p\n        bind += struct.pack(\"!H\", 0)\n        self._send(b\"P\", parse)\n        self._send(b\"B\", bind)\n        self._send(b\"D\", b\"\
    P\\0\")\n        self._send(b\"E\", b\"\\0\" + struct.pack(\"!I\", 0))\n        self._send(b\"S\")\n        rows, types, error = [], [], None\n        while True:\n            kind, payload = self._read()\n\
    \            if kind == b\"T\":\n                (n,) = struct.unpack(\"!H\", payload[:2])\n                pos, types = 2, []\n                for _ in range(n):\n                    end = payload.index(b\"\
    \\0\", pos)\n                    pos = end + 1\n                    _table, _col, type_oid, _size, _mod, _fmt = struct.unpack(\"!IhIhiH\", payload[pos:pos + 18])\n                    types.append(type_oid)\n\
    \                    pos += 18\n            elif kind == b\"D\":\n                (n,) = struct.unpack(\"!H\", payload[:2])\n                pos, row = 2, []\n                for i in range(n):\n  \
    \                  (size,) = struct.unpack(\"!i\", payload[pos:pos + 4])\n                    pos += 4\n                    if size < 0:\n                        row.append(None)\n                 \
    \       continue\n                    raw = payload[pos:pos + size]\n                    pos += size\n                    if i < len(types) and types[i] == 17 and raw.startswith(b\"\\\\x\"):  # bytea\n\
    \                        row.append(bytes.fromhex(raw[2:].decode()))\n                    else:\n                        row.append(raw.decode())\n                rows.append(tuple(row))\n         \
    \   elif kind == b\"E\":\n                error = PgError(self._fields(payload))\n            elif kind == b\"Z\":\n                if error:\n                    raise error\n                return\
    \ rows\n\n    def close(self):\n        try:\n            self._send(b\"X\")\n            self.sock.close()\n        except OSError:\n            pass\n\n\nclass Pool:\n    \"\"\"A few connections to\
    \ one database, created on demand; a connection that failed is thrown away.\"\"\"\n\n    def __init__(self, url, cafile=None, size=4):\n        self.url, self.cafile, self.size = url, cafile, size\n\
    \        self.idle = []\n        self.lock = threading.Lock()\n\n    def query(self, sql, params=()):\n        with self.lock:\n            conn = self.idle.pop() if self.idle else None\n        try:\n\
    \            if conn is None:\n                conn = Connection(self.url, self.cafile)\n            rows = conn.query(sql, params)\n        except PgError:\n            with self.lock:\n          \
    \      if len(self.idle) < self.size:\n                    self.idle.append(conn)\n            raise\n        except Exception:\n            if conn:\n                conn.close()\n            raise\n\
    \        with self.lock:\n            if len(self.idle) < self.size:\n                self.idle.append(conn)\n            else:\n                conn.close()\n        return rows\n"
  pkcs12.js: "// PKCS#12 (.p12 / .pfx) inspection in the browser (WebCrypto only; nothing is sent anywhere):\n//   inspect(bytes)            is this a PKCS#12 file, how is it protected, does it hold a private\
    \ key?\n//   checkPassword(bytes, pw)  verifies the password against the file's integrity MAC (RFC 7292, Appendix B)\n//   certificates(bytes, pw)   subject / issuer / expiry of the certificates, when\
    \ they are PBES2 (AES) encrypted or\n//                             not encrypted at all; legacy RC2 / 3DES files are reported as such (WebCrypto has no RC2)\n// The password is only used in this page's\
    \ memory.\n\nconst OID = {\n  data: '1.2.840.113549.1.7.1', signedData: '1.2.840.113549.1.7.2', encryptedData: '1.2.840.113549.1.7.6',\n  pbes2: '1.2.840.113549.1.5.13', pbkdf2: '1.2.840.113549.1.5.12',\
    \ pbmac1: '1.2.840.113549.1.5.14',\n  keyBag: '1.2.840.113549.1.12.10.1.1', shroudedKeyBag: '1.2.840.113549.1.12.10.1.2', certBag: '1.2.840.113549.1.12.10.1.3',\n  x509Certificate: '1.2.840.113549.1.9.22.1',\
    \ commonName: '2.5.4.3', organization: '2.5.4.10',\n};\nconst HASHES = { // digest OID / HMAC OID -> [WebCrypto name, block size (bytes), output size]\n  '1.3.14.3.2.26': ['SHA-1', 64, 20], '2.16.840.1.101.3.4.2.1':\
    \ ['SHA-256', 64, 32],\n  '2.16.840.1.101.3.4.2.2': ['SHA-384', 128, 48], '2.16.840.1.101.3.4.2.3': ['SHA-512', 128, 64],\n  '1.2.840.113549.2.7': ['SHA-1', 64, 20], '1.2.840.113549.2.9': ['SHA-256',\

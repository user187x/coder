  logo-view.js: "// General > Change Logo: shows the logo in use and uploads a replacement (stored in Coder's database by the\n// coder-ui-updates service; boot.js hands it to every page so the dashboard's\
    \ logo component shows it).\nconst API = '/__coder-ui/api/logo';\nconst $ = (id) => document.getElementById(id);\nconst MAX = 1024 * 1024;\nconst TYPES = ['image/png', 'image/jpeg', 'image/svg+xml',\
    \ 'image/webp', 'image/gif'];\n// Coder's own mark (the dashboard's logo component), drawn in the current text colour.\nconst CODER_MARK = '<svg viewBox=\"0 0 120 60\" fill=\"currentColor\" aria-label=\"\
    Coder logo\"><path d=\"M34.5381 0C54.5335 6.29882e-05 65.7432 10.1355 66.122 25.0544L48.853 25.6216C48.3984 17.3514 41.544 11.9189 34.5381 12.0809C24.919 12.2836 17.7989 19.1351 17.7988 29.9999C17.7988\
    \ 40.8648 24.919 47.5951 34.5381 47.5951C41.544 47.5945 48.2468 42.4055 49.0043 34.1352L66.2733 34.5408C65.8189 49.7027 53.9276 60 34.5381 60C15.1484 60 0 48.2433 0 29.9999C7.1014e-05 11.6757 14.5426\
    \ 0 34.5381 0ZM120 1.7728V58.5299H74.5559V1.7728H120Z\"/></svg>';\n\nlet pending = null; // {dataUrl, type, size, name}\nconst kb = (n) => (n < 1024 ? `${n} bytes` : `${Math.round(n / 1024)} KB`);\n\
    \nfunction toast(text, isError) {\n  const t = $('toast');\n  t.textContent = text;\n  t.classList.toggle('error', !!isError);\n  t.hidden = false;\n  clearTimeout(toast.timer);\n  toast.timer = setTimeout(()\
    \ => { t.hidden = true; }, 5000);\n}\n\nfunction show(slot, src) {\n  const node = $(slot);\n  node.replaceChildren();\n  if (src) {\n    const img = document.createElement('img');\n    img.src = src;\n\
    \    img.alt = 'Logo';\n    node.append(img);\n  } else {\n    node.innerHTML = CODER_MARK; // constant markup above, no user data\n  }\n}\n\nasync function post(path, body) {\n  const res = await fetch(path,\
    \ {\n    method: 'POST', credentials: 'same-origin',\n    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'coder-ui' }, body: JSON.stringify(body),\n  });\n  const data = await res.json().catch(()\
    \ => ({}));\n  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);\n  return data;\n}\n\nasync function load() {\n  const res = await fetch(API, { credentials: 'same-origin', cache: 'no-store'\
    \ });\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);\n  if (!data.available) {\n    $('state').textContent = 'Not available';\n\
    \    $('meta').textContent = \"The service is not connected to Coder's database, so a logo cannot be stored.\";\n    $('open').disabled = true;\n    return;\n  }\n  $('state').textContent = data.set\
    \ ? 'Custom logo' : \"Coder's logo\";\n  $('state').className = `pill ${data.set ? 'ok' : 'info'}`;\n  show('p-dark', data.url); show('p-light', data.url);\n  $('reset').hidden = !data.set;\n  $('meta').textContent\
    \ = data.set\n    ? `${data.type.replace('image/', '').toUpperCase()}, ${kb(data.bytes)} \xB7 uploaded by ${data.updatedBy} on ${new Date(data.updatedAt).toLocaleString()}`\n    : 'No custom logo: Coder\
    \ shows its own.';\n}\n\nfunction pick(file) {\n  pending = null;\n  $('save').disabled = true;\n  $('new-previews').hidden = true;\n  if (!file) return;\n  if (!TYPES.includes(file.type)) { $('file-info').textContent\
    \ = `${file.name}: not a PNG, JPEG, SVG, WebP or GIF image.`; return; }\n  if (file.size > MAX) { $('file-info').textContent = `${file.name} is ${(file.size / 1048576).toFixed(1)} MB; the limit is 1\
    \ MB.`; return; }\n  const reader = new FileReader();\n  reader.onload = () => {\n    pending = { dataUrl: reader.result, type: file.type, size: file.size, name: file.name };\n    for (const slot of\
    \ ['n-dark', 'n-light', 'n-signin']) show(slot, reader.result);\n    $('new-previews').hidden = false;\n    $('drop-text').innerHTML = '';\n    $('drop-text').append(Object.assign(document.createElement('b'),\
    \ { textContent: file.name }), ' \xB7 choose another or drop it here');\n    $('file-info').textContent = `${kb(file.size)}. This is how it will look.`;\n    $('save').disabled = false;\n  };\n  reader.readAsDataURL(file);\n\
    }\n\n// The frame is as tall as its page, so a centred dialog could sit below the fold or under Coder's bottom bars. Keep it\n// inside the part of the frame that is on screen: top of the visible area,\
    \ at most its height (the dialog's content\n// scrolls, its buttons stay at the bottom), re-fitted while the dashboard scrolls or resizes.\nfunction fitDialog(dialog) {\n  try {\n    const r = window.frameElement.getBoundingClientRect();\n\
    \    const vh = window.parent.innerHeight;\n    const bottomBars = [...window.parent.document.querySelectorAll('.sticky.bottom-0, #coder-classification-bottom')]\n      .reduce((h, e) => Math.max(h,\
    \ vh - e.getBoundingClientRect().top), 0);\n    const top = Math.max(0, -r.top);\n    const visible = Math.min(vh - bottomBars, r.bottom) - Math.max(0, r.top);\n    dialog.style.marginTop = `${top +\
    \ 12}px`;\n    dialog.style.maxHeight = `${Math.max(280, visible - 24)}px`;\n  } catch { /* not inside Coder */ }\n}\nfunction revealDialog() {\n  const dialog = document.querySelector('dialog');\n\
    \  fitDialog(dialog);\n  const refit = () => (dialog.open ? fitDialog(dialog) : window.parent.removeEventListener('scroll', refit));\n  try {\n    window.parent.addEventListener('scroll', refit, { passive:\
    \ true });\n    window.parent.addEventListener('resize', refit, { passive: true });\n  } catch { /* not inside Coder */ }\n}\n\nfunction openDialog() {\n  pick(null);\n  $('file').value = '';\n  $('file-info').textContent\
    \ = '';\n  $('drop-text').innerHTML = '<b>Choose an image</b> or drop it here<br><small>PNG, JPEG, SVG, WebP or GIF \xB7 up to 1 MB \xB7 a wide logo about 3\u20134\xD7 as wide as it is tall works best</small>';\n\
    \  $('dialog').showModal();\n  revealDialog();\n}\n\n$('open').addEventListener('click', openDialog);\n$('cancel').addEventListener('click', () => $('dialog').close());\n$('file').addEventListener('change',\
    \ () => pick($('file').files[0]));\nconst drop = $('drop');\ndrop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });\ndrop.addEventListener('dragleave', () =>\
    \ drop.classList.remove('over'));\ndrop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); });\ndrop.addEventListener('keydown', (e)\
    \ => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });\n\n$('save').addEventListener('click', async () => {\n  if (!pending) return;\n  $('save').disabled = true;\n\
    \  try {\n    await post(API, { dataUrl: pending.dataUrl });\n    $('dialog').close();\n    toast('Logo saved. Reloading the dashboard to show it\u2026');\n    await load();\n    setTimeout(() => {\
    \ try { window.top.location.reload(); } catch { /* not inside Coder */ } }, 1200);\n  } catch (e) {\n    toast(e.message, true);\n    $('save').disabled = false;\n  }\n});\n\n$('reset').addEventListener('click',\
    \ async () => {\n  if (!window.confirm(\"Remove the custom logo and show Coder's logo again?\")) return;\n  try {\n    await post(API + '/reset', {});\n    toast(\"Coder's logo is back. Reloading\u2026\
    \");\n    await load();\n    setTimeout(() => { try { window.top.location.reload(); } catch { /* not inside Coder */ } }, 1200);\n  } catch (e) {\n    toast(e.message, true);\n  }\n});\n\nload().catch((e)\
    \ => { $('state').textContent = 'Error'; $('meta').textContent = e.message; });\n"
  logo.css: ".previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }\n.preview { margin: 0; border: 1px solid var(--border); border-radius:\
    \ 8px; overflow: hidden; }\n.preview figcaption { font-size: 12px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--border); }\n.navbar-mock { display: flex; align-items: center;\
    \ gap: 18px; height: 56px; padding: 0 16px; }\n.signin-mock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 120px; }\n.preview.dark .navbar-mock,\
    \ .preview.dark .signin-mock { background: #09090b; color: #fafafa; }\n.preview.light .navbar-mock { background: #ffffff; color: #09090b; }\n.nav-words { font-size: 12px; opacity: .7; }\n.logo-slot\
    \ { display: inline-flex; align-items: center; height: 28px; }\n.logo-slot.big { height: 48px; }\n.logo-slot img { height: 100%; max-width: 200px; object-fit: contain; }\n.logo-slot svg { height: 100%;\
    \ width: auto; }\n.actions { margin: 4px 0 12px; }\n.end { justify-content: flex-end; margin-top: 16px; }\ndialog { width: min(640px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius:\
    \ 10px; padding: 24px;\n  background: hsl(var(--coder-surface-secondary, 240 6% 10%)); color: var(--text); box-shadow: 0 24px 64px rgb(0 0 0 / .45); }\ndialog::backdrop { background: rgb(0 0 0 / .55);\
    \ }\ndialog h2 { margin-bottom: 16px; }\n.drop { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 120px; padding: 16px;\n  border: 2px dashed hsl(var(--coder-border-secondary,\

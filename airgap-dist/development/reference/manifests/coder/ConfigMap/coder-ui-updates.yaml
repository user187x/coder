    \ render(); });\n  for (const [id, key] of [['bg', 'background'], ['fg', 'color']]) {\n    $(id).addEventListener('input', () => { form[key] = $(id).value.toLowerCase(); render(); });\n    $(`${id}-hex`).addEventListener('input',\

  banner-dock.js: "// Docks the coder-banner announcement in Coder's navigation bar: first in its right-hand group (the\n// \"flex items-center gap-3 ml-auto\" div, before the menus and notifications).\
    \ The navbar is sticky, so the\n// announcement stays in view wherever the page is scrolled. dashboard.css draws it there as a rounded bar that fills\n// the navbar from the Workspaces drop-down to\
    \ the menus.\n//\n// coder-banner's loader (banner.js) owns the element: it builds, replaces and removes it, and after every DOM change it\n// puts it back right after the navbar (`header.insertAdjacentElement('afterend',\
    \ banner)` whenever the banner is not\n// the navbar's next sibling). Moving it with a MutationObserver of our own would make the two fight forever, so that\n// one call is redirected into the navbar\
    \ instead; once the banner is docked the call changes nothing, so no further\n// mutation follows. Everything else banner.js does works on the element wherever it is.\n//\n// Below Tailwind's md breakpoint\
    \ Coder's navbar keeps only the notifications and the menu button: there the banner stays\n// full width under the navbar (sticky too, see dashboard.css), as coder-banner places it.\nconst BANNER_ID\
    \ = 'coder-system-banner';\nconst NAVBAR = 'div.sticky.top-0.min-h-\\\\[72px\\\\]';\nconst SLOT = ':scope > div.ml-auto';\nconst wide = window.matchMedia('(min-width: 768px)');\n\nfunction slotOf(header)\
    \ {\n  return header instanceof Element && header.matches(NAVBAR) ? header.querySelector(SLOT) : null;\n}\n\n// Full text on hover, taken when the pointer arrives (a countdown changes it every second),\
    \ only when it is cut short.\nfunction bindTitle(banner) {\n  if (banner.dataset.cuiDock) return;\n  banner.dataset.cuiDock = '1';\n  banner.addEventListener('mouseenter', () => {\n    const text =\
    \ banner.querySelector('[data-banner-text]');\n    if (!text) return;\n    if (text.scrollHeight > text.clientHeight + 1) text.title = text.textContent.replace(/\\s+/g, ' ').trim();\n    else text.removeAttribute('title');\n\
    \  });\n}\n\nfunction dock(banner, header) {\n  const slot = wide.matches && slotOf(header);\n  if (!slot) return false;\n  if (slot.firstElementChild !== banner) slot.prepend(banner);\n  bindTitle(banner);\n\
    \  return true;\n}\n\nconst insertAdjacentElement = Element.prototype.insertAdjacentElement;\nElement.prototype.insertAdjacentElement = function (where, element) {\n  if (where === 'afterend' && element\
    \ && element.id === BANNER_ID && dock(element, this)) return element;\n  return insertAdjacentElement.call(this, where, element);\n};\n\n// Now (banner.js may have placed it already) and whenever the\
    \ window crosses the breakpoint.\nfunction relocate() {\n  const banner = document.getElementById(BANNER_ID);\n  const header = banner && document.querySelector(NAVBAR);\n  if (!header || dock(banner,\
    \ header)) return;\n  if (banner.parentElement && banner.parentElement.parentElement === header) header.after(banner);\n}\nwide.addEventListener('change', relocate);\nrelocate();\n"
  banner-enhance.js: "// Everything coder-ui-updates adds to the coder-banner announcement, applied to the banner's DOM after coder-banner has\n// drawn it (by ack.js on every Coder page, by admin-embed.js\
    \ on the admin page's previews, so both look the same):\n//\n//   Confirm      the \"\xD7\" becomes a \"Confirm\" button (undismissable banners get one that leaves the banner in place)\n//   Markdown\
    \     **bold**  *italic*  ~~strike~~  `code`  [text](https://\u2026 or /path)\n//   Countdown    {{countdown to=2026-10-04T02:00:00Z format=dhms done=\"now\"}} anywhere in the message ticks live\n//\
    \   Colours      custom background / text colours, carried in the banner's (otherwise unused) lead-in field as\n//                {{colors bg=#rrggbb fg=#rrggbb}}\n//\n// coder-banner itself stores\
    \ and delivers the text unchanged (so its live push, ids and dismissals keep working); it\n// is only drawn differently here. All text is inserted with textContent / createTextNode, never as HTML.\n\
    \nconst BUTTON_STYLE = [\n  'flex-shrink:0', 'box-sizing:border-box', 'padding:3px 14px', 'border-radius:6px', 'cursor:pointer',\n  'border:1px solid rgba(255,255,255,.6)', 'background:rgba(255,255,255,.16)',\
    \ 'color:inherit',\n  'font:inherit', 'font-size:13px', 'font-weight:600', 'line-height:18px', 'white-space:nowrap',\n].join(';');\n\nexport const COLORS_RE = /^\\{\\{colors bg=(#[0-9a-fA-F]{6}) fg=(#[0-9a-fA-F]{6})\\\
    }\\}$/;\nexport const COUNTDOWN_RE = /\\{\\{countdown\\s+to=([0-9T:.\\-+Z]+)(?:\\s+format=(dhms|clock|words))?(?:\\s+done=\"([^\"]{0,80})\")?\\s*\\}\\}/;\nconst COUNTDOWN_ALL = new RegExp(COUNTDOWN_RE.source,\
    \ 'g');\n\nexport function colorsToken(bg, fg) { return `{{colors bg=${bg} fg=${fg}}}`; }\n\nexport function countdownToken({ to, format = 'dhms', done = 'now' }) {\n  const safeDone = String(done).replace(/[\"\
    {}]/g, '').slice(0, 80);\n  return `{{countdown to=${to} format=${format} done=\"${safeDone}\"}}`;\n}\n\nexport function parseCountdown(text) {\n  const m = COUNTDOWN_RE.exec(text || '');\n  return\
    \ m ? { to: m[1], format: m[2] || 'dhms', done: m[3] ?? 'now', index: m.index, length: m[0].length } : null;\n}\n\n// ------------------------------------------------------------------ countdown\nconst\
    \ pad = (n) => String(n).padStart(2, '0');\n\nexport function formatRemaining(ms, format) {\n  let s = Math.max(0, Math.floor(ms / 1000));\n  const d = Math.floor(s / 86400); s -= d * 86400;\n  const\

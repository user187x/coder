    \  def rate_ok(self, user_id):\n        times = [\n            t for t in self.sent.get(user_id, []) if time.time() - t < CHAT_RATE[1]\n        ]\n        self.sent[user_id] = times\n        if len(times)\
    \ >= CHAT_RATE[0]:\n            return False\n        times.append(time.time())\n        return True\n\n    def send(self, user, admin, peer, text, image=None, page=\"\"):\n        \"\"\"image: (content\

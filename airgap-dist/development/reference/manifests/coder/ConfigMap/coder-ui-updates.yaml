    \            self.loaded_at = 0\n            self.cache = None  # boot.js stops pointing at it at once\n\n\ndef parse_logo(data_url):\n    m = re.match(r\"^data:([a-z+/.-]+);base64,([A-Za-z0-9+/=\\\

    \ 'cui-av-row' },\n        el('span', { class: 'cui-av-preview', 'aria-hidden': 'true' }),\n        el('div', { class: 'cui-av-pick' },\n          el('label', { for: 'cui-av-file', class: 'cui-av-btn',\

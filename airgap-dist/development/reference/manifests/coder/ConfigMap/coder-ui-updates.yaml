    \ { display: flex; gap: 10px; }\n.fact .k { width: 150px; flex-shrink: 0; color: var(--muted); }\n.fact.ok .v { color: var(--ok); } .fact.warn .v { color: var(--warn); } .fact.error .v { color: var(--danger);\
    \ }\n.end { justify-content: flex-end; margin-top: 12px; }\n\n/* Fitted to the visible part of the frame by the page's script; the buttons stay reachable while the body scrolls. */\ndialog { overflow:\

  users-row.js: "// Admin > Users: a click on a user's row opens their workspace (the rewritten users table calls open(event, user)).\n// One workspace: that workspace's page; none or several: their workspaces\
    \ list, as the row menu's \"View workspaces\".\n// Clicks meant for something inside the row (Chat, the menu, the groups / roles pop-overs, their dialogs, which React\n// bubbles through portals) and\
    \ text selections are left alone; Ctrl / Cmd-click opens a new tab.\n\nconst IGNORE = 'a, button, input, select, textarea, label, [role=menuitem], [role=menu], [role=dialog], [role=checkbox]';\n\nfunction\
    \ go(url, newTab) {\n  if (newTab) { window.open(url, '_blank', 'noopener'); return; }\n  // react-router follows history changes it is told about: no page reload\n  window.history.pushState({}, '',\
    \ url);\n  window.dispatchEvent(new PopStateEvent('popstate', { state: {} }));\n}\n\n// click: {row, target, newTab}, taken from the event while it was dispatched (React clears currentTarget afterwards)\n\
    export async function open(click, user) {\n  const { row, target } = click || {};\n  if (!user || !user.username || !(row instanceof Element) || !(target instanceof Element)) return;\n  if (!row.contains(target)\
    \ || (target !== row && target.closest(IGNORE))) return;   // inside the row, not a control\n  if (String(window.getSelection?.() || '').trim()) return;\n  const newTab = !!click.newTab;\n  const list\
    \ = `/workspaces?filter=${encodeURIComponent(`owner:${user.username}`)}`;\n  const root = document.documentElement;\n  root.classList.add('coder-ui-busy');\n  try {\n    const q = new URLSearchParams({\
    \ q: `owner:${user.username}`, limit: '2' });\n    const res = await fetch(`/api/v2/workspaces?${q}`, { credentials: 'same-origin', headers: { Accept: 'application/json' } });\n    const data = res.ok\
    \ ? await res.json() : null;\n    const one = data && data.count === 1 && data.workspaces?.[0];\n    go(one ? `/@${encodeURIComponent(one.owner_name || user.username)}/${encodeURIComponent(one.name)}`\
    \ : list, newTab);\n  } catch {\n    go(list, newTab);\n  } finally {\n    root.classList.remove('coder-ui-busy');\n  }\n}\n"
  view.css: "/* Shared look of the coder-ui-updates views (Classification, Keycloak) shown inside Coder's Deployment settings.\n   --coder-* are Coder's theme tokens (HSL triplets), filled in by views.js\
    \ and kept in step with the dashboard. */\n:root {\n  --bg: hsl(var(--coder-surface-primary, 240 10% 4%));\n  --card: hsl(var(--coder-surface-primary, 240 10% 4%));\n  --raised: hsl(var(--coder-surface-secondary,\
    \ 240 6% 10%));\n  --text: hsl(var(--coder-content-primary, 0 0% 100%));\n  --muted: hsl(var(--coder-content-secondary, 240 5% 65%));\n  --border: hsl(var(--coder-border-default, 240 4% 16%));\n  --primary:\
    \ hsl(var(--coder-surface-invert-primary, 240 6% 90%));\n  --primary-text: hsl(var(--coder-content-invert, 240 10% 4%));\n  --danger: hsl(var(--coder-content-destructive, 0 91% 71%));\n  --warn: hsl(var(--coder-content-warning,\
    \ 31 97% 72%));\n  --ok: hsl(var(--coder-content-success, 142 76% 36%));\n  --link: hsl(var(--coder-content-link, 213 94% 68%));\n}\n* { box-sizing: border-box; }\nhtml { background: var(--bg); }\n\
    body { margin: 0; background: transparent; color: var(--text); font: 14px/1.5 var(--coder-font, system-ui, sans-serif); }\nmain { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-bottom:\
    \ 8px; }\nh2 { font-size: 16px; font-weight: 600; margin: 0; }\nh3 { font-size: 14px; font-weight: 600; margin: 0; }\np { margin: 0; }\n.card { border: 1px solid var(--border); border-radius: 8px; padding:\
    \ 24px; background: var(--card); min-width: 0; }\n.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }\n.hint { color:\
    \ var(--muted); font-size: 13px; }\n.label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }\n.field { display: block; margin: 0 0 18px; min-width: 0; border: 0; padding: 0;\
    \ }\n.field:last-child { margin-bottom: 0; }\ninput[type=text], input[type=url], input[type=number], select {\n  width: 100%; padding: 8px 11px; border: 1px solid hsl(var(--coder-border-secondary, var(--coder-border-default)));\n\
    \  border-radius: 6px; background: transparent; color: var(--text); font: inherit; }\ninput:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--link);\
    \ outline-offset: 2px; }\n.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }\n.btn { font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 6px; border: 1px solid\
    \ var(--border);\n  background: transparent; color: var(--text); cursor: pointer; }\n.btn:hover:not(:disabled) { border-color: var(--text); }\n.btn:disabled { opacity: .45; cursor: not-allowed; }\n\
    .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }\n.btn-primary:hover:not(:disabled) { opacity: .9; border-color: var(--primary); }\n.btn-small {\
    \ padding: 4px 10px; font-size: 12px; }\n.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }\n.pill {\
    \ font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }\n.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn);\
    \ } .pill.error { color: var(--danger); } .pill.info, .pill.unknown { color: var(--muted); }\n.toast { display: none !important; } /* views.js shows #toast in the dashboard's viewport */\n\n/* switch\
    \ */\n.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }\n.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;\
    \ }\n.track { position: relative; width: 40px; height: 22px; flex-shrink: 0; border-radius: 999px; background: hsl(var(--coder-surface-tertiary));\n  border: 1px solid hsl(var(--coder-border-secondary,\
    \ var(--coder-border-default))); transition: background .15s ease; }\n.thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition:\
    \ transform .15s ease; }\n.switch input:checked + .track { background: var(--ok); border-color: var(--ok); }\n.switch input:checked + .track .thumb { transform: translateX(18px); background: #fff; }\n\
    .switch input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }\n.switch-state { font-weight: 400; font-size: 13px; color: var(--muted); }\n@media (prefers-reduced-motion:\
    \ reduce) { .track, .thumb { transition: none; } }\n\n/* range */\ninput[type=range] { width: 100%; accent-color: var(--link); }\n.range-row { display: flex; align-items: center; gap: 14px; }\n.range-row\
    \ output { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }\n\n/* colour controls */\n.swatches { display: flex; flex-wrap: wrap; gap: 8px; }\n.swatch {\
    \ width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }\n.swatch[aria-pressed=true] { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg)\
    \ inset; }\n.colour-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }\n.colour-input { width: 44px; height: 34px; padding: 0 2px; border: 1px solid var(--border); border-radius:\
    \ 6px; background: transparent; cursor: pointer; }\n.hex { width: 100px !important; font-family: ui-monospace, monospace; }\n"
  views.js: "// The Deployment-settings views coder-ui-updates adds to Coder (served at /__coder-ui/views.js).\n//\n// The rewritten Coder router renders an empty <div class=\"coder-ui-view\"> for /deployment/<view>\
    \ and calls\n// mount(div, {view, title}) from this module. That div sits in Coder's own layout (breadcrumbs, Deployment sidebar,\n// content column); this fills it with a Coder-style page header and\
    \ the view itself, in a same-origin frame so its\n// styles and Coder's never mix:\n//\n//   announcement    the coder-banner admin page (/__banner/admin). It sends `frame-ancestors 'none'`, so it is\n\
    //                   fetched (with the user's Coder session) and loaded as a srcdoc frame; its scripts run unchanged\n//                   under Coder's CSP. announcement-embed.css fits it to Coder's\
    \ look, admin-embed.js rearranges it.\n//   classification  /__coder-ui/classification.html  the top/bottom classification marking\n//   keycloak        /__coder-ui/keycloak.html        Keycloak <->\
    \ Coder sign-in: discovery, suggestions, fixes\n//   customize       /__coder-ui/logo.html            the logo (Coder's own Appearance settings follow it, rendered by Coder)\n//   network         /__coder-ui/network.html\
    \         the live cluster map, above Coder's own Network settings\n//   agents          /agents                          Coder Agents itself, embedded: the frame's own dashboard.js hides its\n//  \
    \                                                  navbar, marking and announcement (the page around it has them)\n//\n// Each frame gets Coder's theme tokens and fonts (kept in step when the user switches\
    \ theme), grows with its content,\n// and has its #toast shown in the dashboard's viewport.\n\nconst ADMIN_URL = '/__banner/admin';\nconst asset = (name) => new URL(name, import.meta.url).pathname;\n\
    const VIEWS = {\n  announcement: { description: 'Show an announcement across the Coder dashboard and see who has confirmed reading it.' },\n  classification: { src: asset('classification.html'), description:\
    \ 'Mark every Coder page with its classification, in a bar at the very top and the very bottom.' },\n  keycloak: { src: asset('keycloak.html'), description: \"Keycloak sign-in for Coder: what is configured,\
    \ what is missing, and one click to fix it.\" },\n  customize: { src: asset('logo.html'), description: 'The logo shown everywhere in Coder (navigation bar, sign-in and set-up pages, browser tab icon),\
    \ and your appearance: theme and terminal font.' },\n  network: { src: asset('network.html'), keepTitle: true, description: 'A live map of the Kubernetes cluster Coder runs on: nodes, their addresses\
    \ and load, and the workspaces on each. Refreshes every 5 seconds.' },\n  agents: { src: '/agents', embed: true, description: 'Coder Agents: AI agents that work in your workspaces. Chats open right\
    \ here.' },\n  monitoring: { src: asset('monitoring.html'), description: 'Every user and their running workspaces. Open one to follow its logs live.' },\n  certificates: { src: asset('certificates.html'),\
    \ description: 'Your .p12 certificate, installed into every workspace you start as ~/.cert/<your username>.p12.' },\n  'workspace-health': { src: asset('workspace-health.html'), description: 'Workspaces\
    \ whose last build failed or whose agents are unhealthy. Select one to open it.' },\n};\n\n// Frames navigate the dashboard without a full reload: react-router follows history changes it is told about.\n\
    window.__cuiNavigate = (url) => {\n  window.history.pushState({}, '', url);\n  window.dispatchEvent(new PopStateEvent('popstate', { state: {} }));\n};\n// Coder theme tokens (HSL triplets on <html>)\
    \ handed to the frames as --coder-<name>.\nconst TOKENS = [\n  'surface-primary', 'surface-secondary', 'surface-tertiary', 'surface-invert-primary',\n  'content-primary', 'content-secondary', 'content-disabled',\
    \ 'content-invert', 'content-link',\n  'content-success', 'content-warning', 'content-destructive', 'border-default', 'border-secondary',\n];\n\nfunction el(tag, className, text) {\n  const node = document.createElement(tag);\n\
    \  if (className) node.className = className;\n  if (text) node.textContent = text;\n  return node;\n}\n\n// Same markup and utility classes as Coder's SettingsHeader, so the heading matches the other\
    \ Deployment pages.\nfunction header(title, description) {\n  const group = el('hgroup', 'flex flex-col justify-between items-start gap-2 pb-6 sm:flex-row');\n  const col = el('div', 'text-sm flex flex-col\
    \ gap-2 flex-1');\n  const row = el('div', 'flex flex-row gap-2 items-center');\n  row.append(el('h1', 'm-0 flex items-center gap-2 leading-tight text-3xl font-semibold', title));\n  col.append(row,\
    \ el('p', 'm-0 text-content-secondary font-medium leading-normal', description));\n  group.append(col);\n  return group;\n}\n\nfunction notice(text) {\n  return el('p', 'm-0 text-sm text-content-secondary',\
    \ text);\n}\n\nfunction themeCss() {\n  const root = document.documentElement;\n  const style = getComputedStyle(root);\n  const vars = TOKENS.map((t) => `--coder-${t}: ${style.getPropertyValue(`--${t}`).trim()};`).join('\
    \ ');\n  const font = getComputedStyle(document.body).fontFamily.replace(/[<>]/g, '');\n  const scheme = root.classList.contains('light') ? 'light' : 'dark';\n  return `:root { ${vars} --coder-font:\
    \ ${font}; color-scheme: ${scheme}; }`;\n}\n\n// Coder's own @font-face rules (absolute /assets/ URLs), so the embedded page uses the same typeface.\nfunction fontFaces() {\n  const rules = [];\n  for\
    \ (const sheet of document.styleSheets) {\n    let list;\n    try { list = sheet.cssRules; } catch { continue; } // cross-origin sheet\n    for (const rule of list) if (rule instanceof CSSFontFaceRule)\
    \ rules.push(rule.cssText);\n  }\n  return rules.join('\\n');\n}\n\n// The frame element and the page inside it must use the same color-scheme, or the browser paints an opaque canvas.\nfunction frameScheme(frame)\
    \ {\n  frame.style.colorScheme = document.documentElement.classList.contains('light') ? 'light' : 'dark';\n}\n\nfunction syncTheme(frame) {\n  frameScheme(frame);\n  const doc = frame.contentDocument;\n\
    \  const style = doc && doc.getElementById('coder-ui-theme');\n  if (style) style.textContent = themeCss();\n}\n\n// Grow the frame with its content (the page scrolls, never the frame).\nfunction autoSize(frame)\
    \ {\n  const doc = frame.contentDocument;\n  let queued = false;\n  const fit = () => {\n    queued = false;\n    const body = doc.body;\n    if (!body) return;\n    // The emoji picker and toasts can\
    \ overflow the body: include descendants' extent.\n    let bottom = body.scrollHeight;\n    for (const pop of doc.querySelectorAll('.emoji-pop:not([hidden]), [data-cui-overflow]:not([hidden])')) {\n\
    \      bottom = Math.max(bottom, pop.getBoundingClientRect().bottom + doc.defaultView.scrollY);\n    }\n    frame.style.height = `${Math.ceil(bottom) + 4}px`;\n  };\n  const queue = () => { if (!queued)\
    \ { queued = true; requestAnimationFrame(fit); } };\n  new doc.defaultView.ResizeObserver(queue).observe(doc.body);\n  new doc.defaultView.MutationObserver(queue).observe(doc.body, { subtree: true,\
    \ childList: true, attributes: true, attributeFilter: ['hidden', 'open', 'class'] });\n  fit();\n}\n\n// The admin page's toast is `position: fixed` inside the frame, i.e. at the frame's bottom edge,\
    \ which can be below the\n// fold (announcement-embed.css hides it). Show the same message pinned to the dashboard's viewport instead.\nfunction relayToast(frame, root) {\n  const source = frame.contentDocument.getElementById('toast');\n\
    \  if (!source) return;\n  // A child of the view's own div, so React removes it together with the view when the user navigates away.\n  const toast = el('div', 'text-sm font-medium');\n  toast.setAttribute('role',\
    \ 'status');\n  toast.setAttribute('aria-live', 'polite');\n  toast.hidden = true;\n  root.append(toast);\n  // Above the bottom classification bar, if one is shown (classification.js sets its height\
    \ on <html>).\n  const base = 'position:fixed;right:24px;bottom:calc(24px + var(--coder-classification-h, 0px));z-index:50;max-width:min(420px,calc(100vw - 48px));'\n    + 'padding:12px 16px;border:1px\
    \ solid;border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .25);color:hsl(var(--content-primary));';\n  const copy = () => {\n    const error = source.classList.contains('error');\n    toast.textContent\
    \ = source.textContent;\n    toast.hidden = source.hidden;\n    toast.style.cssText = base + (error\n      ? 'background:hsl(var(--surface-destructive));border-color:hsl(var(--border-destructive))'\n\
    \      : 'background:hsl(var(--surface-secondary));border-color:hsl(var(--border-default))');\n  };\n  const watch = new frame.contentWindow.MutationObserver(copy);\n  watch.observe(source, { attributes:\
    \ true, childList: true, characterData: true, subtree: true });\n}\n\n// The frame is ready: theme, size and toast; keep following Coder's theme until the view is gone.\nfunction wire(frame, root) {\n\
    \  frame.addEventListener('load', () => {\n    const doc = frame.contentDocument;\n    if (!doc || !doc.body) return;\n    let style = doc.getElementById('coder-ui-theme');\n    if (!style) {\n    \
    \  style = doc.createElement('style');\n      style.id = 'coder-ui-theme';\n      doc.head.append(style);\n    }\n    if (!doc.getElementById('coder-ui-fonts')) {\n      const fonts = doc.createElement('style');\n\
    \      fonts.id = 'coder-ui-fonts';\n      fonts.textContent = fontFaces();\n      doc.head.prepend(fonts);\n    }\n    syncTheme(frame);\n    autoSize(frame);\n    relayToast(frame, root);\n  });\n\
    \  const themeWatch = new MutationObserver(() => {\n    if (!root.isConnected) { themeWatch.disconnect(); return; }\n    syncTheme(frame);\n  });\n  themeWatch.observe(document.documentElement, { attributes:\
    \ true, attributeFilter: ['class'] });\n}\n\nfunction frameFor(title) {\n  const frame = el('iframe', 'block w-full border-0');\n  frame.title = title;\n  frame.style.cssText = 'display:block;width:100%;border:0;min-height:320px;background:transparent';\n\
    \  frameScheme(frame);\n  return frame;\n}\n\n// A whole Coder page (Agents) in a frame: it fills the rest of the window instead of growing with its content (the\n// page keeps its own scrolling panes),\
    \ and follows the theme through Coder's own appearance setting.\nfunction embedFrame(title, src) {\n  const frame = frameFor(title);\n  frame.dataset.cuiEmbed = '1';\n  frame.dataset.cuiEmbedPath =\
    \ src;\n  frame.allow = 'clipboard-read; clipboard-write';\n  frame.style.minHeight = '560px';\n  frame.style.border = '1px solid hsl(var(--border-default))';\n  frame.style.borderRadius = '8px';\n\
    \  const fit = () => {\n    if (!frame.isConnected) { window.removeEventListener('resize', fit); return; }\n    const top = frame.getBoundingClientRect().top + window.scrollY;\n    frame.style.height\
    \ = `calc(100vh - ${Math.round(top) + 40}px - var(--coder-classification-h, 0px))`;\n  };\n  window.addEventListener('resize', fit);\n  requestAnimationFrame(fit);\n  frame.src = src;\n  return frame;\n\
    }\n\nexport async function mount(root, { view = 'announcement', title = 'Announcement', keepTitle = false } = {}) {\n  const spec = { ...(VIEWS[view] || VIEWS.announcement), ...(keepTitle ? { keepTitle:\
    \ true } : {}) };\n  const top = () => header(title, spec.description);\n  if (!spec.keepTitle) document.title = `${title} - Coder`;\n  root.replaceChildren(top(), notice('Loading\u2026'));\n\n  if\
    \ (spec.embed) {\n    root.replaceChildren(top(), embedFrame(title, spec.src));\n    return;\n  }\n  if (spec.src) {\n    const frame = frameFor(title);\n    wire(frame, root);\n    frame.src = spec.src;\n\
    \    root.replaceChildren(top(), frame);\n    return;\n  }\n\n  let res;\n  try {\n    res = await fetch(ADMIN_URL, { credentials: 'same-origin', redirect: 'manual', cache: 'no-store' });\n  } catch\
    \ {\n    root.replaceChildren(top(), notice('The banner service could not be reached. Reload the page to try again.'));\n    return;\n  }\n  if (res.type === 'opaqueredirect' || res.status === 401)\
    \ {\n    root.replaceChildren(top(), notice('Your Coder session has expired. Sign in again to edit the banner.'));\n    return;\n  }\n  if (res.status === 403) {\n    root.replaceChildren(top(), notice('Only\
    \ Coder admins can change the announcement banner.'));\n    return;\n  }\n  if (!res.ok) {\n    root.replaceChildren(top(), notice(`The banner service is not available right now (HTTP ${res.status}).\
    \ Is the coder-banner app running?`));\n    return;\n  }\n  const head = `<link rel=\"stylesheet\" href=\"${asset('announcement-embed.css')}\"><style id=\"coder-ui-fonts\">${fontFaces()}</style>`\n\
    \    + `<style id=\"coder-ui-theme\">${themeCss()}</style>`;\n  const html = (await res.text())\n    .replace('<html', '<html data-coder-embed')\n    .replace('</head>', () => `${head}</head>`)\n  \
    \  .replace('</body>', () => `<script type=\"module\" src=\"${asset('admin-embed.js')}\"></script></body>`);\n  const frame = frameFor(`${title}: announcement banner editor`);\n  wire(frame, root);\n\
    \  frame.srcdoc = html;\n  root.replaceChildren(top(), frame);\n}\n"
  workspace-health-view.js: "// Health > Workspace Health page: the table of failed / unhealthy workspaces; a row opens that workspace.\nimport { unhealthy } from './workspace-health.js';\n\nconst $ = (id)\
    \ => document.getElementById(id);\nconst ICON_OK = '<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path\
    \ d=\"M5 8.2l2 2 4-4.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';\nconst ICON_ALERT = '<svg viewBox=\"0 0 16 16\" aria-hidden=\"\
    true\"><path d=\"M8 1.6l6.6 12H1.4z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M8 6.2v3.6M8 11.6v.1\" stroke=\"currentColor\" stroke-width=\"1.6\"\
    \ stroke-linecap=\"round\"/></svg>';\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElement(tag);\n  for (const [k, v] of Object.entries(attrs)) {\n    if (k === 'class')\
    \ node.className = v;\n    else if (k === 'text') node.textContent = v;\n    else node.setAttribute(k, v);\n  }\n  node.append(...children.filter(Boolean));\n  return node;\n}\n\nfunction open(w) {\n\
    \  const url = `/@${encodeURIComponent(w.owner)}/${encodeURIComponent(w.name)}`;\n  try { window.parent.__cuiNavigate(url); } catch { window.top.location.href = url; }\n}\n\nasync function refresh()\
    \ {\n  try {\n    const list = await unhealthy();\n    const worst = list.some((w) => w.severity === 'error') ? 'error' : list.length ? 'warning' : 'ok';\n    $('state').className = `state ${worst}`;\n\
    \    $('state').innerHTML = worst === 'ok' ? ICON_OK : ICON_ALERT; // constant markup\n    $('count').className = `pill ${worst === 'ok' ? 'info' : worst === 'error' ? 'error' : 'warn'}`;\n    $('count').textContent\
    \ = list.length ? `${list.length} need${list.length === 1 ? 's' : ''} attention` : 'All healthy';\n    const rows = list.map((w) => {\n      const tr = el('tr', { class: 'ws', tabindex: '0', role: 'link',\
    \ title: `Open ${w.owner}/${w.name}` },\n        el('td', {}, el('b', {}, el('span', { class: `sev ${w.severity}` }), `${w.owner} / ${w.name}`), el('small', { text: `status: ${w.status}` })),\n    \
    \    el('td', { text: w.problems.map((p) => p.text).join('; ') }),\n        el('td', { text: w.template || '\u2014' }),\n        el('td', { text: w.updatedAt ? new Date(w.updatedAt).toLocaleString()\
    \ : '\u2014' }));\n      tr.addEventListener('click', () => open(w));\n      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(w); });\n      return tr;\n    });\n    $('rows').replaceChildren(...(rows.length\
    \ ? rows : [el('tr', {}, el('td', { class: 'empty', colspan: '4', text: 'Nothing to triage: no workspace has failed or become unhealthy.' }))]));\n    $('checked').textContent = `checked ${new Date().toLocaleTimeString()}`;\n\
    \  } catch (e) {\n    $('count').textContent = 'Error';\n    $('checked').textContent = e.message;\n  }\n  setTimeout(refresh, 30000);\n}\n\nrefresh();\n"
  workspace-health.css: ".acc { border: 1px solid var(--border); border-radius: 8px; }\n.acc > summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none;\
    \ }\n.acc > summary::-webkit-details-marker { display: none; }\n.acc > summary::before { content: '\u203A'; width: 10px; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s\
    \ ease; }\n.acc[open] > summary::before { transform: rotate(90deg); }\n.acc[open] > summary { border-bottom: 1px solid var(--border); }\n.acc h2 { flex: 1; font-size: 14px; }\n.state { display: inline-flex;\
    \ width: 18px; height: 18px; }\n.state svg { width: 18px; height: 18px; }\n.state.ok { color: #3b82f6; } .state.warning { color: var(--warn); } .state.error { color: var(--danger); }\n.checked { font-size:\
    \ 12px; }\ntable { width: 100%; border-collapse: collapse; font-size: 13px; }\nth { text-align: left; font-weight: 600; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--border);\
    \ }\ntd { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }\ntbody tr:last-child td { border-bottom: 0; }\ntr.ws { cursor: pointer; }\ntr.ws:hover td { background: hsl(var(--coder-surface-secondary)\
    \ / .6); }\ntr.ws:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }\n.ws b { display: block; }\n.ws small { color: var(--muted); }\n.sev { display: inline-block; width: 8px; height:\
    \ 8px; border-radius: 50%; margin-right: 6px; }\n.sev.error { background: var(--danger); } .sev.warning { background: var(--warn); }\n.empty { color: var(--muted); text-align: center; }\n.foot { margin-top:\
    \ 10px; }\n"
  workspace-health.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Workspace Health \xB7\
    \ Coder</title>\n  <link rel=\"stylesheet\" href=\"/__coder-ui/view.css\">\n  <link rel=\"stylesheet\" href=\"/__coder-ui/workspace-health.css\">\n  <style id=\"coder-ui-theme\"></style>\n</head>\n\
    <body>\n<main>\n  <section class=\"card\" aria-labelledby=\"wh-h\">\n    <details class=\"acc\" id=\"acc\" open>\n      <summary>\n        <span class=\"state\" id=\"state\" aria-hidden=\"true\"></span>\n\
    \        <h2 id=\"wh-h\">Unhealthy or failed workspaces</h2>\n        <span class=\"pill info\" id=\"count\">Checking\u2026</span>\n        <span class=\"hint checked\" id=\"checked\"></span>\n    \
    \  </summary>\n      <table>\n        <thead><tr><th scope=\"col\">Workspace</th><th scope=\"col\">Problem</th><th scope=\"col\">Template</th><th scope=\"col\">Last build</th></tr></thead>\n       \
    \ <tbody id=\"rows\"></tbody>\n      </table>\n    </details>\n    <p class=\"hint foot\">Select a workspace to open it. Checked every 30 seconds.</p>\n  </section>\n</main>\n<div id=\"toast\" class=\"\
    toast\" role=\"status\" aria-live=\"polite\" hidden></div>\n<script type=\"module\" src=\"/__coder-ui/workspace-health-view.js\"></script>\n</body>\n</html>\n"
  workspace-health.js: "// Health > Workspace Health: which workspaces need attention (latest build failed, or agents unhealthy / not\n// connected). Shared by the icon beside \"Workspace Health\" in the\
    \ Health panel (icon) and its page\n// (workspace-health-view.js). Reads Coder's own API with the admin's session; nothing is stored.\n\nexport async function unhealthy() {\n  const res = await fetch('/api/v2/workspaces?limit=1000',\
    \ { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } });\n  if (!res.ok) throw new Error(`Coder workspaces API: HTTP ${res.status}`);\n  const { workspaces = []\
    \ } = await res.json();\n  const out = [];\n  for (const w of workspaces) {\n    const build = w.latest_build || {};\n    const agents = (build.resources || []).flatMap((r) => r.agents || []);\n   \
    \ const problems = [];\n    if (build.status === 'failed' || build.job?.status === 'failed') problems.push({ kind: 'failed', text: `${build.transition || 'build'} failed` });\n    if (build.status ===\
    \ 'running') {\n      for (const a of agents) {\n        if (a.health && a.health.healthy === false) problems.push({ kind: 'unhealthy', text: `agent ${a.name}: ${a.health.reason || 'unhealthy'}` });\n\
    \        else if (a.status && a.status !== 'connected' && a.status !== 'connecting') problems.push({ kind: 'unhealthy', text: `agent ${a.name}: ${a.status}` });\n        if (['start_error', 'start_timeout',\
    \ 'shutdown_error'].includes(a.lifecycle_state)) problems.push({ kind: 'unhealthy', text: `agent ${a.name}: ${a.lifecycle_state.replace('_', ' ')}` });\n      }\n      if (w.health && w.health.healthy\
    \ === false && !problems.length) problems.push({ kind: 'unhealthy', text: 'unhealthy' });\n    }\n    if (problems.length) {\n      out.push({\n        id: w.id, owner: w.owner_name, name: w.name, template:\
    \ w.template_display_name || w.template_name,\n        status: build.status, updatedAt: build.updated_at, problems,\n        severity: problems.some((p) => p.kind === 'failed') ? 'error' : 'warning',\n\
    \      });\n    }\n  }\n  return out.sort((a, b) => (a.severity === b.severity ? a.owner.localeCompare(b.owner) : a.severity === 'error' ? -1 : 1));\n}\n\nconst ICONS = {\n  ok: '<svg viewBox=\"0 0\
    \ 16 16\" width=\"16\" height=\"16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M5 8.2l2 2 4-4.4\" fill=\"none\" stroke=\"\
    currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>',\n  alert: '<svg viewBox=\"0 0 16 16\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"M8 1.6l6.6\
    \ 12H1.4z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M8 6.2v3.6M8 11.6v.1\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"\
    /></svg>',\n};\n\n// The icon beside \"Workspace Health\": a blue check when nothing needs attention, otherwise an alert in the Health\n// page's warning / error colour. Re-checked every 30 seconds\
    \ while the panel is on screen.\nexport function icon(el) {\n  el.style.cssText = 'display:inline-flex;align-items:center;width:16px;height:16px;flex-shrink:0';\n  const paint = async () => {\n    if\
    \ (!el.isConnected) return;\n    try {\n      const list = await unhealthy();\n      const error = list.some((w) => w.severity === 'error');\n      el.innerHTML = list.length ? ICONS.alert : ICONS.ok;\
    \ // constant markup\n      el.style.color = list.length ? `hsl(var(--content-${error ? 'destructive' : 'warning'}))` : '#3b82f6';\n      el.title = list.length ? `${list.length} workspace${list.length\
    \ === 1 ? ' needs' : 's need'} attention` : 'All workspaces healthy';\n      el.setAttribute('role', 'img');\n      el.setAttribute('aria-label', el.title);\n    } catch {\n      el.innerHTML = '';\n\
    \    }\n    setTimeout(paint, 30000);\n  };\n  paint();\n}\n"

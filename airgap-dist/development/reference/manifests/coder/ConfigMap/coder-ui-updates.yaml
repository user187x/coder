    \  const mem = d.nodes.reduce((a, n) => a + ((n.usage && n.usage.memory) || 0), 0);\n  const memCap = d.nodes.reduce((a, n) => a + (n.allocatable.memory || 0), 0);\n  const onNodes = new Set(d.workspaces.map((w)\

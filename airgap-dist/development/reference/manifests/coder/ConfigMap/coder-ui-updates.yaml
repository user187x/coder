    \ nothing changed\" % name]\n\n\n# --------------------------------------------------------------------------- Chat (admins <-> users)\nCHAT_MAX_TEXT = 4000\nCHAT_KEEP_DAYS = 30\nCHAT_TYPING_SECONDS\

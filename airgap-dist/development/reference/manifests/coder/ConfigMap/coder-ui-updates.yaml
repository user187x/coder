    \    ctx.imageSmoothingQuality = 'high';\n    ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, SIZE, SIZE);\n    const webp = canvas.toDataURL('image/webp', 0.9);\n    return webp.startsWith('data:image/webp')\

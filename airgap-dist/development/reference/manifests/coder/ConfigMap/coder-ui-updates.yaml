    \ int(r[0]), int(r[1]), r[2]\n\n\ndef norm_ts(ts):\n    \"\"\"Kubernetes log timestamps drop trailing zeros (\u202649.9Z, \u202649.91Z): pad to nanoseconds so they sort as text.\"\"\"\n    if not ts.endswith(\"\
    Z\"):\n        return ts\n    base, _, frac = ts[:-1].partition(\".\")\n    return \"%s.%sZ\" % (base, (frac or \"0\").ljust(9, \"0\")[:9])\n\n\nclass Follower(threading.Thread):\n    \"\"\"Streams\
    \ one pod container's log (Kubernetes API, follow=true) into the LogStore until nobody has looked for\n    IDLE_STOP seconds or the pod is gone. Reconnects (from the last timestamp) when the stream\
    \ breaks.\n    \"\"\"\n\n    IDLE_STOP = 120\n\n    def __init__(self, logs, ns, pod, container, stream):\n        super().__init__(daemon=True)\n        self.logs, self.ns, self.pod, self.container,\
    \ self.stream_id = (\n            logs,\n            ns,\n            pod,\n            container,\n            stream,\n        )\n        self.last_poll = time.time()\n        self.state = \"starting\"\
    \n        self.error = None\n\n    def _write(self, batch, stored):\n        \"\"\"Makes room first (the oldest lines go), then inserts: the stream never holds more than the cap, not even\n        between\

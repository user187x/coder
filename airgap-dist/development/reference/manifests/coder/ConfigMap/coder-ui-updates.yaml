  keycloak.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Keycloak \xB7 Coder</title>\n\
    \  <link rel=\"stylesheet\" href=\"/__coder-ui/view.css\">\n  <link rel=\"stylesheet\" href=\"/__coder-ui/keycloak.css\">\n  <style id=\"coder-ui-theme\"></style>\n</head>\n<body>\n<main>\n  <section\

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    meta.helm.sh/release-name: coder-workspace
    meta.helm.sh/release-namespace: coder
  labels:
    app.kubernetes.io/managed-by: Helm
  name: coder-workspace-icons
  namespace: coder
spec:
  hostnames:
  - coder.grey-marshall.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: coder-workspace-icons
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /__icons/

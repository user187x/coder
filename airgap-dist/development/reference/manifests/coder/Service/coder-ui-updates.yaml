apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: coder-ui-updates
    app.kubernetes.io/name: coder-ui-updates
    app.kubernetes.io/part-of: coder
  name: coder-ui-updates
  namespace: coder
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: coder-ui-updates
  sessionAffinity: None
  type: ClusterIP

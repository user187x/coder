apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: coder-workspace
    meta.helm.sh/release-namespace: coder
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-workspace-icons
  name: coder-workspace-icons
  namespace: coder
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace-icons
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/icons: e26ec1093c66a7ad9b9e586a869aeddf3ba4bc4e2af26ebc8adb8fa09b253a62
      labels:
        app.kubernetes.io/name: coder-workspace-icons
    spec:
      containers:
      - image: nginxinc/nginx-unprivileged:1.30.5-alpine
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /__icons/marimo.svg
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/icons
          name: icons
        - mountPath: /etc/nginx/conf.d/default.conf
          name: icons
          subPath: default.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: coder-workspace-icons
        name: icons

apiVersion: v1
kind: Namespace
metadata: {name: keycloak}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak, namespace: keycloak}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.4
        args: [start-dev]
        env:
        - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
        - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin-test-pw}
        - {name: KC_HOSTNAME, value: https://keycloak.airgap.test}
        - {name: KC_HTTP_ENABLED, value: "true"}
        - {name: KC_PROXY_HEADERS, value: xforwarded}
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /realms/master, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak, namespace: keycloak}
spec:
  selector: {app: keycloak}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: keycloak, namespace: keycloak}
spec:
  hostnames: [keycloak.airgap.test]
  parentRefs: [{name: traefik-gateway, namespace: traefik}]
  rules: [{backendRefs: [{name: keycloak, port: 8080}]}]

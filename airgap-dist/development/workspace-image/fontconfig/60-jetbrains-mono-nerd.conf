<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- JetBrains Mono Nerd Font is the workspace's monospace font (terminals, editors, the desktop), and Noto Color Emoji
     comes right after it for what it lacks: emoji (a terminal shows a box for a character no font has). -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>

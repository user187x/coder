[supervisord]
nodaemon=true
user=neko
pidfile=/tmp/coder-browser-supervisor.pid
logfile=/tmp/coder-browser-supervisor.log
logfile_maxbytes=1MB

[program:browser-sessions]
command=/usr/bin/python3 /opt/coder/neko-sessions.py
environment=HOME="/home/neko",USER="neko"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/coder-browser-sessions.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[include]
files=/etc/neko/supervisord/certificates.conf

[unix_http_server]
file=/tmp/coder-browser-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/coder-browser-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:certificates]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/python3 /opt/coder/browser-certificates.py
autorestart=true
priority=850
user=neko
stdout_logfile=/var/log/neko/certificates.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

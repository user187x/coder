{{- /*
Optional ways in besides the Service (port-forward, LoadBalancer, NodePort). Everything goes to Coder, which forwards
/__coder-ui and /__banner to the platform services itself. Without accessURL the rules match any host.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $host := include "cp.host" . }}
{{- $wildcard := include "cp.wildcardHost" . }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder
  namespace: {{ $ns }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: coder
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      {{- if or $host $wildcard }}
      hosts:
        {{- with $host }}
        - {{ . | quote }}
        {{- end }}
        {{- with $wildcard }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
  {{- end }}
  rules:
    {{- range $h := compact (list $host $wildcard) | default (list "") }}
    {{- if $h }}
    - host: {{ $h | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  number: 80
    {{- end }}
{{- end }}
{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: {{ $ns }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: coder
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled is true" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- if or $host $wildcard }}
  hostnames:
    {{- with $host }}
    - {{ . | quote }}
    {{- end }}
    {{- with $wildcard }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
{{- end }}

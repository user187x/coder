{{- /*
Setup Jobs, as Helm hooks (Argo CD runs them as PreSync and PostSync hooks):
  coder-platform-secrets     before everything: generates Secret coder-db and the first admin's password if missing.
                             Helm and Argo CD never render these Secrets, so a re-sync can't change a password.
  coder-platform-first-user  after everything: creates the first admin once Coder answers, unless one exists.
*/ -}}
{{- $needDB := .Values.postgres.enabled }}
{{- $needUser := and .Values.firstUser.enabled (not .Values.firstUser.existingSecret) }}
{{- $hook := "pre-install,pre-upgrade" }}
{{- if or $needDB $needUser }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-platform-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  setup.py: |
    {{- .Files.Get "files/setup/setup.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-platform-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
# Read the generated Secrets by name and create missing ones (creation can't be limited by name).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-platform-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- if $needDB }}
      - coder-db
      {{- end }}
      {{- if $needUser }}
      - coder-first-user
      {{- end }}
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-platform-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-platform-setup
subjects:
  - kind: ServiceAccount
    name: coder-platform-setup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-platform-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-platform-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: coder-platform-setup
      restartPolicy: OnFailure
      {{- include "cp.podPlacement" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ .Values.setup.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /setup/setup.py, secrets]
          env:
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: DB_SECRET, value: {{ ternary "coder-db" "" $needDB | quote }}}
            - {name: FIRST_USER_SECRET, value: {{ ternary "coder-first-user" "" $needUser | quote }}}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          {{- include "cp.containerSecurity" . | nindent 10 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
      volumes:
        - name: setup
          configMap:
            name: coder-platform-setup
{{- end }}
{{- if .Values.firstUser.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-platform-first-user
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  setup.py: |
    {{- .Files.Get "files/setup/setup.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-platform-first-user
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-platform-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- include "cp.podPlacement" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: first-user
          image: {{ .Values.setup.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /setup/setup.py, first-user]
          env:
            - {name: CODER_URL, value: "http://coder.{{ .Release.Namespace }}.svc.cluster.local"}
            - {name: FIRST_USER_USERNAME, value: {{ .Values.firstUser.username | quote }}}
            - {name: FIRST_USER_EMAIL, value: {{ .Values.firstUser.email | quote }}}
            - {name: FIRST_USER_NAME, value: {{ .Values.firstUser.name | quote }}}
            - name: FIRST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.firstUserSecret" . }}
                  key: password
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          {{- include "cp.containerSecurity" . | nindent 10 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
      volumes:
        - name: setup
          configMap:
            name: coder-platform-first-user
{{- end }}

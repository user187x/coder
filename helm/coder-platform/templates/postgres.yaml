{{- /*
Coder's database: one PostgreSQL on a PersistentVolumeClaim. Its password is in Secret coder-db, which the setup Job
(setup-secrets.yaml) generates before anything else and never replaces, so re-syncs keep the same password.
*/ -}}
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coder-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: coder-db
spec:
  serviceName: coder-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-db
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: coder-platform
    spec:
      automountServiceAccountToken: false
      {{- include "cp.podPlacement" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: coder
            - name: POSTGRES_DB
              value: coder
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-db
                  key: password
            # A subdirectory: the volume's root may hold lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, coder, -d, coder, -h, 127.0.0.1]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, coder, -d, coder, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: coder-db
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: coder-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: coder-db
spec:
  selector:
    app.kubernetes.io/name: coder-db
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}

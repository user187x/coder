apiVersion: v2
name: coder-platform
description: >-
  This repository's Coder (its dashboard and server changes built in) with everything the dashboard's
  platform pages need: PostgreSQL, the platform service (logo, avatars, template icons, classification,
  announcements, chat, Keycloak, Network, Monitoring, Persistence), the announcement banner service, the
  first admin, and an Ingress or Gateway API route. One release per namespace; no other charts required.
type: application
# Bump version for chart changes and appVersion for a new image (scripts/build_platform_image.sh tags the
# image with appVersion, and the chart deploys that tag when image.tag is empty).
version: 0.1.0
appVersion: "2.0.0-platform.1"
kubeVersion: ">=1.25.0-0"
keywords:
  - coder
  - argocd
sources:
  - https://github.com/user187x/coder/tree/main/helm/coder-platform

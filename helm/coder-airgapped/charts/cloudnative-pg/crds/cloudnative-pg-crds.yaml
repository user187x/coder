apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: clusterimagecatalogs.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: ClusterImageCatalog
    listKind: ClusterImageCatalogList
    plural: clusterimagecatalogs
    singular: clusterimagecatalog
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              componentImages:
                items:
                  properties:
                    image:
                      type: string
                    key:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - image
                  - key
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: Component image keys must be unique
                  rule: self.all(e, self.filter(f, f.key==e.key).size() == 1)
              images:
                items:
                  properties:
                    extensions:
                      items:
                        properties:
                          bin_path:
                            items:
                              type: string
                            type: array
                          dynamic_library_path:
                            items:
                              type: string
                            type: array
                          env:
                            items:
                              properties:
                                name:
                                  minLength: 1
                                  pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                                  type: string
                                value:
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          extension_control_path:
                            items:
                              type: string
                            type: array
                          image:
                            properties:
                              pullPolicy:
                                type: string
                              reference:
                                type: string
                            type: object
                          ld_library_path:
                            items:
                              type: string
                            type: array
                          name:
                            maxLength: 59
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9_]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    image:
                      type: string
                    major:
                      minimum: 10
                      type: integer
                  required:
                  - image
                  - major
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: Images must have unique major versions
                  rule: self.all(e, self.filter(f, f.major==e.major).size() == 1)
            required:
            - images
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources: {}

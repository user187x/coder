{{- /*
metrics-server: live CPU and memory of pods and nodes (the HUD, Health, quotas). Most clusters lack it (EKS too,
unless its add-on is installed). metricsServer.enabled: "auto" installs it only when the cluster has no metrics API
yet, or when this release installed the one it has (so an existing metrics-server, such as the EKS add-on, stays in
charge); true always, false never. As upstream components.yaml v0.8.1, in the release namespace.
*/ -}}
{{- include "ca.values" . -}}
{{- $ms := .Values.metricsServer }}
{{- $install := false }}
{{- if eq (toString $ms.enabled) "true" }}
{{- $install = true }}
{{- else if eq (toString $ms.enabled) "auto" }}
{{- $api := lookup "apiregistration.k8s.io/v1" "APIService" "" "v1beta1.metrics.k8s.io" }}
{{- if not $api }}
{{- $install = true }}
{{- else if eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $api) .Release.Name }}
{{- $install = true }}
{{- end }}
{{- end }}
{{- if and $install (include "platform.hasLayer" .) }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Argo CD wave 5: after the bootstrap (wave 3), so an unready metrics API never holds up the first admin
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: metrics-server
  labels: {app.kubernetes.io/name: metrics-server}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: system:aggregated-metrics-reader
  labels:
    app.kubernetes.io/name: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: system:metrics-server
  labels: {app.kubernetes.io/name: metrics-server}
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: metrics-server-auth-reader
  namespace: kube-system
  labels: {app.kubernetes.io/name: metrics-server}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - {kind: ServiceAccount, name: metrics-server, namespace: {{ $ns }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: metrics-server:system:auth-delegator
  labels: {app.kubernetes.io/name: metrics-server}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - {kind: ServiceAccount, name: metrics-server, namespace: {{ $ns }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: system:metrics-server
  labels: {app.kubernetes.io/name: metrics-server}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - {kind: ServiceAccount, name: metrics-server, namespace: {{ $ns }}}
---
apiVersion: v1
kind: Service
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: metrics-server
  labels: {app.kubernetes.io/name: metrics-server}
spec:
  selector: {app.kubernetes.io/name: metrics-server}
  ports:
    - {name: https, port: 443, protocol: TCP, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: metrics-server
  labels: {app.kubernetes.io/name: metrics-server}
spec:
  replicas: {{ $ms.replicas | default 1 }}
  selector:
    matchLabels: {app.kubernetes.io/name: metrics-server}
  strategy:
    rollingUpdate: {maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: metrics-server}
    spec:
      serviceAccountName: metrics-server
      priorityClassName: system-cluster-critical
      {{- if gt (int ($ms.replicas | default 1)) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: metrics-server}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: metrics-server}
      {{- end }}
      {{- with .Values.uiUpdates.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-server
          image: {{ $ms.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            {{- if $ms.kubeletInsecureTLS }}
            - --kubelet-insecure-tls
            {{- end }}
          ports:
            - {name: https, containerPort: 10250, protocol: TCP}
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {memory: 400Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp-dir, mountPath: /tmp}
      nodeSelector: {kubernetes.io/os: linux}
      volumes:
        - {name: tmp-dir, emptyDir: {}}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  name: v1beta1.metrics.k8s.io
  labels: {app.kubernetes.io/name: metrics-server}
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service: {name: metrics-server, namespace: {{ $ns }}}
  version: v1beta1
  versionPriority: 100
{{- if gt (int ($ms.replicas | default 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metrics-server
  namespace: {{ $ns }}
  labels: {app.kubernetes.io/name: metrics-server}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: metrics-server}
{{- end }}
{{- end }}

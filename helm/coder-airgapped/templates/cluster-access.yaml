{{- /* Admins' kubectl on this cluster (global.clusterAccess): the Keycloak group, as the API server names it, gets
the cluster role. Each admin signs in as themselves; see values.yaml. */ -}}
{{- with .Values.global.clusterAccess }}{{ if and .enabled (include "platform.hasLayer" $) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-cluster-admins
  labels:
    {{- include "ca.labels" $ | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ printf "%s%s" .prefix .group | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRole }}
{{- end }}{{ end }}

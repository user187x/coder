{{- include "ca.values" . -}}
{{- $relay := .Values.uiUpdates.supportRelay }}
{{- if and .Values.uiUpdates.enabled $relay.enabled (include "platform.hasLayer" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "coder-support-relay" }}
apiVersion: v1
kind: Secret
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- range $key := list "auth-secret" "cli-password" "control-secret" }}
  {{- $value := randAlphaNum 48 }}
  {{- if and $existing (index $existing.data $key) }}{{ $value = index $existing.data $key | b64dec }}{{ end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
data:
  turnserver.conf: |
    realm={{ $relay.hostname }}
    server-name={{ $relay.hostname }}
    tls-listening-port=5349
    no-udp
    no-tcp
    no-tlsv1
    no-tlsv1_1
    no-tcp-relay
    cli
    cli-ip=127.0.0.1
    cli-port=5766
    cli-max-output-sessions=256
    no-multicast-peers
    no-software-attribute
    use-auth-secret
    cert=/tls/tls.crt
    pkey=/tls/tls.key
    min-port=49160
    max-port=49259
    user-quota=2
    total-quota=64
    max-bps=5242880
    bps-capacity=167772160
    max-allocate-lifetime=600
    denied-peer-ip=0.0.0.0-255.255.255.255
    denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    log-file=stdout
    simple-log
    pidfile=/tmp/turnserver.pid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: coder-support-relay}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coder-support-relay, app.kubernetes.io/part-of: coder}
    spec:
      {{- with .Values.uiUpdates.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: {{ include "platform.image" (list . $relay.image) | quote }}
          command: [/bin/sh, -c]
          # Both endpoints allocate here. No relay access to other pods, hosts, or public destinations.
          args:
            - |
              set -eu
              umask 077
              cp /config/turnserver.conf /tmp/turnserver.conf
              printf '\nstatic-auth-secret=%s\ncli-password=%s\n' "$(cat /run/relay-secrets/auth-secret)" "$(cat /run/relay-secrets/cli-password)" >> /tmp/turnserver.conf
              exec turnserver -c /tmp/turnserver.conf --listening-ip="$POD_IP" --relay-ip="$POD_IP" --allowed-peer-ip="$POD_IP"
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports: [{name: tls, containerPort: 5349}]
          readinessProbe: &watchdogProbe
            exec:
              command: [/bin/sh, -c, 'test "$(date +%s)" -le "$(cat /run/relay-watchdog/lease 2>/dev/null)"']
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          # Restart closes existing TLS allocations when authorization or the watchdog fails.
          livenessProbe:
            <<: *watchdogProbe
            initialDelaySeconds: 8
            terminationGracePeriodSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The pinned coturn binary carries this file capability and requires it in the bounding set.
            capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: relay-secrets, mountPath: /run/relay-secrets, readOnly: true}
            - {name: watchdog-state, mountPath: /run/relay-watchdog, readOnly: true}
        - name: authorization
          image: {{ .Values.uiUpdates.image | quote }}
          command: [python3, /app/relaywatchdog.py]
          env:
            - {name: RELAY_POLICY_URL, value: {{ printf "https://coder-ui-updates.%s.svc.cluster.local/__coder-ui/internal/support-relay" .Release.Namespace | quote }}}
            - {name: SERVICE_CA_FILE, value: /run/service-ca/ca.crt}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: watchdog-secrets, mountPath: /run/relay-secrets, readOnly: true}
            - {name: service-ca, mountPath: /run/service-ca, readOnly: true}
            - {name: watchdog-state, mountPath: /run/relay-watchdog}
      volumes:
        - name: config
          configMap: {name: coder-support-relay}
        - name: relay-secrets
          secret:
            secretName: coder-support-relay
            defaultMode: 0440
            items: [{key: auth-secret, path: auth-secret}, {key: cli-password, path: cli-password}]
        - name: watchdog-secrets
          secret:
            secretName: coder-support-relay
            defaultMode: 0440
            items: [{key: control-secret, path: control-secret}, {key: cli-password, path: cli-password}]
        - name: service-ca
          configMap: {name: coder-ui-updates-internal-tls}
        - name: watchdog-state
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tls
          secret: {secretName: {{ .Values.secrets.wildcardTls.name }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: coder-support-relay}
  ports: [{name: tls, port: 5349, targetPort: tls}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ $relay.gatewayClassName }}
  listeners:
    - name: support-relay
      hostname: {{ $relay.hostname | quote }}
      port: {{ $relay.gatewayPort }}
      protocol: TLS
      tls: {mode: Passthrough}
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs: [{name: coder-support-relay, sectionName: support-relay}]
  hostnames: [{{ $relay.hostname | quote }}]
  rules:
    - backendRefs: [{name: coder-support-relay, port: 5349}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-support-relay
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: coder-support-relay}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.uiUpdates.gateway.namespace }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 5349}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: coder-support-relay}}
      ports: [{protocol: UDP, port: 49160, endPort: 49259}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: coder-ui-updates}}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: coder-support-relay}}
      ports: [{protocol: UDP, port: 49160, endPort: 49259}]
{{- end }}

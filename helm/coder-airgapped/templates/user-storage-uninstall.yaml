{{- include "ca.values" . -}}
{{- /* Uninstalling with the Cloud Drive: before Helm removes the CSI driver's node plugin, a pre-delete hook stops every
     pod that mounts a Cloud Drive volume (workspaces' Deployments scaled to 0, other pods deleted) and waits until they
     are gone, so the kubelet can still unmount them (files/hooks/stop_cloud_drive_mounts.py). Without it the workspace
     pods never finish terminating and deleting the namespace hangs. Argo CD runs it as a PreDelete hook. */ -}}
{{- $g := .Values.global.userStorage | default dict -}}
{{- $u := .Values.userStorage -}}
{{- if and (eq (toString $g.enabled) "true") (include "platform.hasLayer" .) .Values.uiUpdates.enabled $u.csi.enabled }}
{{- $ns := .Release.Namespace }}
{{- $name := "coder-user-storage-uninstall" }}
{{- /* Its RBAC exists only for the hook: made just before it, removed after it. */ -}}
{{- $hook := dict "helm.sh/hook" "pre-delete" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" "argocd.argoproj.io/hook" "PreDelete" "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation,HookSucceeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $ns }}}
---
# Which claims are the Cloud Drive's: their PersistentVolumes name the CSI driver (cluster-scoped, read only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-{{ $name }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ns }}-{{ $name }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $ns }}-{{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $ns }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 280
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.uiUpdates.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stop-mounts
          image: {{ .Values.bootstrap.image }}
          command: ["python3", "-c", {{ .Files.Get "files/hooks/stop_cloud_drive_mounts.py" | quote }}]
          env:
            - {name: NAMESPACE, value: {{ $ns | quote }}}
            - {name: CSI_DRIVER, value: ru.yandex.s3.csi}
            - {name: TIMEOUT, value: "240"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
{{- end }}

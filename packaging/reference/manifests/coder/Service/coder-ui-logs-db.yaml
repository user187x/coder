apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: coder-ui-updates
    app.kubernetes.io/name: coder-ui-updates
    app.kubernetes.io/part-of: coder
  name: coder-ui-logs-db
  namespace: coder
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: postgres
  selector:
    app.kubernetes.io/name: coder-ui-logs-db
  sessionAffinity: None
  type: ClusterIP

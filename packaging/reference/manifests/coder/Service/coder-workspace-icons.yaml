apiVersion: v1
kind: Service
metadata:
  annotations:
    meta.helm.sh/release-name: coder-workspace
    meta.helm.sh/release-namespace: coder
  labels:
    app.kubernetes.io/managed-by: Helm
  name: coder-workspace-icons
  namespace: coder
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: coder-workspace-icons
  sessionAffinity: None
  type: ClusterIP

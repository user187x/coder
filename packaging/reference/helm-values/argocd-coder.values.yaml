coder:
  image:
    repo: ghcr.io/user187x/coder-platform
    tag: 2.0.0-platform.4
  env:
  # The platform build asks the add-on service (Health > User Quota) before creating a workspace
  - name: CODER_PLATFORM_SERVICE_ROUTES
    value: /__coder-ui=http://coder-ui-updates.coder.svc.cluster.local
  - name: CODER_BOOTSTRAP_INITIAL_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: coder-init-auth
        key: password
  - name: CODER_ACCESS_URL
    value: https://coder.grey-marshall.com
  - name: CODER_WILDCARD_ACCESS_URL
    value: '*.grey-marshall.com'
  - name: CODER_NOTIFICATIONS_METHOD
    value: 'webhook'
  - name: CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
    value: 'https://coder.grey-marshall.com/webhook'
  - name: CODER_PG_CONNECTION_URL
    valueFrom:
      secretKeyRef:
        name: coder-db-app
        key: uri
  - name: CODER_TLS_CA_CERT
    value: /etc/ssl/certs/ca.crt
  - name: CODER_OIDC_ISSUER_URL
    value: https://keycloak.grey-marshall.com/realms/master
  - name: CODER_OIDC_CLIENT_ID
    value: coder
  - name: CODER_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: keycloaking-coder-oidc
        key: client-secret
  - name: CODER_OIDC_SCOPES
    value: openid,profile,email
  - name: CODER_OIDC_USERNAME_FIELD
    value: preferred_username
  - name: CODER_OIDC_EMAIL_FIELD
    value: email
  - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
    value: 'true'
  - name: CODER_OIDC_SIGN_IN_TEXT
    value: Sign in with your certificate
  - name: CODER_OIDC_ICON_URL
    value: /icon/keycloak.svg
  - name: CODER_OIDC_ALLOW_SIGNUPS
    value: 'true'
  - name: SSL_CERT_DIR
    value: /etc/ssl/certs:/etc/keycloaking/ca
  - name: CODER_DISABLE_PASSWORD_AUTH
    value: 'true'
  - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
    value: 'false'
  volumeMounts:
  - name: tls-coder-wildcard-tls
    mountPath: /etc/ssl/certs/coder/coder-wildcard-tls
    readOnly: true
  - name: ca-bundle
    mountPath: /etc/ssl/certs/ca.crt
    subPath: ca.crt
  - name: keycloaking-ca
    mountPath: /etc/keycloaking/ca
    readOnly: true
  volumes:
  - name: tls-coder-wildcard-tls
    secret:
      secretName: tls-wild-cert
  - name: ca-bundle
    secret:
      secretName: tls-ca
      items:
      - key: ca.crt
        path: ca.crt
  - name: keycloaking-ca
    secret:
      secretName: keycloaking-coder-ca
  service:
    type: ClusterIP
  httproute:
    enable: true
    host: coder.grey-marshall.com
    wildcardHost: '*.grey-marshall.com'
    parentRefs:
    - name: traefik-gateway
      namespace: traefik
      kind: Gateway
      group: gateway.networking.k8s.io
extraTemplates:
- |
  apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
    name: coder-db
  spec:
    instances: 2
    primaryUpdateStrategy: unsupervised
    storage:
      size: 10Gi
      storageClass: standard-k8s

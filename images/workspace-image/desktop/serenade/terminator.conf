# The Serenade desktop theme's Terminator (coder-desktop-theme): Tokyo Night colours, JetBrains Mono.
[global_config]
  title_hide_sizetext = True
  inactive_color_offset = 1.0
[keybindings]
[profiles]
  [[default]]
    background_color = "#1a1b26"
    foreground_color = "#c0caf5"
    cursor_color = "#c0caf5"
    palette = "#15161e:#f7768e:#9ece6a:#e0af68:#7aa2f7:#bb9af7:#7dcfff:#a9b1d6:#414868:#f7768e:#9ece6a:#e0af68:#7aa2f7:#bb9af7:#7dcfff:#c0caf5"
    font = JetBrainsMono Nerd Font Light 11
    use_system_font = False
    show_titlebar = False
    scrollback_lines = 10000
    scrollbar_position = hidden
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
[plugins]

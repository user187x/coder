# The Classic desktop theme's Terminator (coder-desktop-theme): Terminator's own colours, JetBrains Mono (as the
# workspace image's XFCE terminal).
[global_config]
  title_hide_sizetext = True
[keybindings]
[profiles]
  [[default]]
    font = JetBrainsMono Nerd Font Light 11
    use_system_font = False
    show_titlebar = False
    scrollback_lines = 10000
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
[plugins]

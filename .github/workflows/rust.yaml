name: rust

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust*.yaml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust*.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coder_rust_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODER_TEST_ALTERNATE_IAC_BINARY: ${{ runner.temp }}/tofu
      CODER_TEST_TERRAFORM_BINARY: ${{ runner.temp }}/terraform
      CODER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coder_rust_test?sslmode=disable
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.rust }} test --workspace --locked
      - run: cargo +${{ matrix.rust }} test -p coder-server --test control_plane --locked -- --ignored
      - run: cargo +${{ matrix.rust }} test -p coder-server --test postgres --locked -- --ignored external_postgres_configuration
      - name: Verify PostgreSQL TLS and client certificates
        run: python3 scripts/test-postgres-tls.py
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      - name: Install Terraform for local infrastructure tests
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/terraform.zip" https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip
          echo "0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a  $RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP"
      - name: Install OpenTofu for interoperability tests
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tofu.zip" https://github.com/opentofu/opentofu/releases/download/v1.10.6/tofu_1.10.6_linux_amd64.zip
          echo "15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac  $RUNNER_TEMP/tofu.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/tofu.zip" tofu LICENSE -d "$RUNNER_TEMP"
      - run: cargo +${{ matrix.rust }} test -p coder-server --test infrastructure --locked -- --ignored
      - run: cargo +${{ matrix.rust }} test -p coder-server --test networking --locked -- --ignored
      - name: Exercise the embedded engine through real infrastructure jobs
        env:
          CODER_EMBEDDED_ENGINE_KIND: opentofu
          CODER_EMBEDDED_ENGINE_PATH: ${{ runner.temp }}/tofu
          CODER_EMBEDDED_ENGINE_LICENSE_PATH: ${{ runner.temp }}/LICENSE
          CODER_TEST_USE_EMBEDDED_ENGINE: "1"
        run: |
          export CODER_EMBEDDED_ENGINE_SHA256="$(sha256sum "$RUNNER_TEMP/tofu" | cut -d ' ' -f 1)"
          cargo +${{ matrix.rust }} test -p coder-server --test infrastructure --locked -- --ignored

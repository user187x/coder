name: rust

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yaml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coder_rust_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coder_rust_test?sslmode=disable
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.rust }} test --workspace --locked
      - run: cargo +${{ matrix.rust }} test -p coder-server --test control_plane --locked -- --ignored

name: rust-bundle

on:
  workflow_dispatch:
    inputs:
      engine:
        type: choice
        description: Infrastructure engine to embed
        options: [opentofu, terraform]
        default: opentofu
        required: true

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Download and verify engine archive
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p "$RUNNER_TEMP/engine"
          case "$ENGINE" in
            terraform)
              url=https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip
              expected=0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a
              binary=terraform
              license=LICENSE.txt
              ;;
            opentofu)
              url=https://github.com/opentofu/opentofu/releases/download/v1.10.6/tofu_1.10.6_linux_amd64.zip
              expected=15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac
              binary=tofu
              license=LICENSE
              ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/engine.zip" "$url"
          echo "$expected  $RUNNER_TEMP/engine.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/engine.zip" -d "$RUNNER_TEMP/engine"
          digest="$(sha256sum "$RUNNER_TEMP/engine/$binary" | cut -d ' ' -f 1)"
          bash scripts/build-bundle.sh "$ENGINE" "$RUNNER_TEMP/engine/$binary" "$digest" "$RUNNER_TEMP/engine/$license"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coder-rust-${{ inputs.engine }}-linux-amd64
          path: rust/dist/coder-${{ inputs.engine }}.tar.gz
          if-no-files-found: error

[default]
extend-ignore-identifiers-re = ["gho_.*"]
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "retrive_process_informations", "(#|//)\\s*spellchecker:ignore-next-line\\n.*"]

[default.extend-identifiers]
filp = "filp"
filp_open = "filp_open"
PT_REGS_PARM1 = "PT_REGS_PARM1"
RTO = "RTO"
passin = "passin"
fpr = "fpr"
als = "als"
ba = "ba"
caf = "caf"
dout = "dout"
nd = "nd"
vertexes = "vertexes"
alog = "alog"
Jetbrains = "JetBrains"
IST = "IST"
MacOS = "macOS"
AKS = "AKS"
O_WRONLY = "O_WRONLY"
AIBridge = "AI Bridge"
# plural of SIEM, as in security information and event management
SIEMs = "SIEMs"

[default.extend-words]
AKS = "AKS"
# do as sudo replacement
doas = "doas"
darcula = "darcula"
Hashi = "Hashi"
trialer = "trialer"
encrypter = "encrypter"
# as in helsinki
hel = "hel"
# this is used as proto node
pn = "pn"
# typos doesn't like the EDE in TLS_ECDHE_RSA_WITH_3DES_EDE_CBC_SHA
EDE = "EDE"
# HELO is an SMTP command
HELO = "HELO"
LKE = "LKE"
byt = "byt"
cpy = "cpy"
Cpy = "Cpy"
typ = "typ"
# file extensions used in seti icon theme
styl = "styl"
edn = "edn"
Inferrable = "Inferrable"
# Go standard library uses American English single-l spelling throughout encoding/json etc.
unmarshaling = "unmarshaling"
marshaling = "marshaling"
IIF = "IIF"

[files]
extend-exclude = [
	# Imported cluster snapshots, vendored Kubernetes resources and generated image inventory.
	"packaging/reference/**",
	"packaging/airgap/prereqs/**",
	"helm/coder-airgapped/charts/traefik/**",
	"platform/image-contents.json",
	# Vendored game engine settings and data (see its README): third-party keys such as snd_mport.
	"site/static/doom/**",
	"**.svg",
	"**.png",
	"**.lock",
	"go.sum",
	"go.mod",
	# These files contain base64 strings that confuse the detector
	"**XService**.ts",
	"**identity.go",
	"**/*_test.go",
	"**/*.test.tsx",
	"**/pnpm-lock.yaml",
	"tailnet/testdata/**",
	"site/src/pages/SetupPage/countries.tsx",
	"provisioner/terraform/testdata/**",
	"coderd/azureidentity/roots_darwin.go",
	"coderd/azureidentity/azureidentity.go",
	# notifications' golden files confuse the detector because of quoted-printable encoding
	"coderd/notifications/testdata/**",
	"agent/agentcontainers/testdata/devcontainercli/**",
	# aibridge fixtures contain truncated streaming chunks that look like typos
	"aibridge/fixtures/**",
	# go-vcr cassettes contain real API responses with 3rd-party content
	"coderd/externalauth/gitprovider/testdata/**",
]
